function renderMk(){const d=MKD,dt=new Date(d+'T12:00:00');let b=`<button class="cl" data-a="cd">关闭</button><h2>${dt.getMonth()+1}月${dt.getDate()}日 补签</h2><p class="pp">漏掉的项目点一下就能补上，补完我还要夸你，胡胡公主 ♡</p>`;b+=S.projects.map(p=>{const c=p.checkins[d];return `<div class="mi card" style="margin:8px 0"><div class="inf"><span class="nm">${esc(p.name)}</span><span class="gl">${c?(c.mk?'已补签':'已完成'):'还没完成'}</span></div>${c?(c.mk?`<button class="del" data-a="mku" data-v="${p.id}">取消补签</button>`:'<span class="dn">✓</span>'):`<button class="pk" data-a="mk" data-v="${p.id}">补签</button>`}</div>`}).join('');b+=dayItems(d)+`<button class="gh" style="margin-top:6px" data-a="mkr">${isRest(d)?'取消这天的休息日':'把这天设为休息日'}</button>`;$('#detc').innerHTML=b}
function todoHtml(){const T=S.todos,op=T.filter(x=>!x.d),dn=T.filter(x=>x.d),li=x=>`<li class="td${x.d?' dn3':''}"><button class="tk" data-a="tdk" data-v="${x.id}" aria-label="完成">${x.d?'✓':''}</button><span class="tt">${x.pin&&!x.d?'<small class="pn">置顶</small>':''}${esc(x.t)}${x.d?'':`<button class="ti l${x.p||0}" data-a="tdl" data-v="${x.id}">${['普通','⭐ 重要','🔥 很重要'][x.p||0]}</button>`}${x.due?`${x.d?`<small>${x.due.slice(5)}</small>`:`<small class="cd ${cdText(x.due,x.tm).startsWith('已')?'od':''}" data-due="${x.due}" data-tm="${x.tm||''}">${cdText(x.due,x.tm)}</small>`}`:''}</span>${x.d?'':`<button class="tx${x.pin?' pin':''}" data-a="tdpin" data-v="${x.id}" aria-label="置顶">📌</button>`}<button class="tx" data-a="tdd" data-v="${x.id}" aria-label="删除">×</button></li>`;return `<div class="tdc"><div class="row"><input class="fld" id="tdn" placeholder="写下要做的事，胡胡公主" maxlength="40"></div><div class="row" style="margin-top:8px;align-items:center;flex-wrap:wrap"><div class="seg" style="margin:0;flex:1 1 100%">${['普通','⭐ 重要','🔥 很重要'].map((t,i)=>`<button class="${TDP===i?'on':''}" data-a="tdp" data-v="${i}">${t}</button>`).join('')}</div><input class="fld" type="date" id="tdd" min="${today}" max="2099-12-31" style="width:auto;flex:1" aria-label="截止日期"><input class="fld" type="time" id="tdt" style="width:auto;flex:1" aria-label="截止时间（可不填）"><button class="pk" data-a="tda">添加</button></div><ul class="tdl">${op.slice().sort((a,b)=>(b.pin?1:0)-(a.pin?1:0)||(b.p||0)-(a.p||0)||(tk(a)<tk(b)?-1:tk(a)>tk(b)?1:0)).map(li).join('')||'<li class="pp">现在没有待办，轻松一下也很好 ♡</li>'}</ul>${dn.length?`<p class="pp" style="margin:10px 0 0">已完成 ${dn.length} 项，好厉害。<button class="tx2" data-a="tdc">清除已完成</button></p><ul class="tdl">${dn.slice(-5).map(li).join('')}</ul>`:''}</div>`}
function renderDet(){if(DET==='__mk')return renderMk();if(DET==='__day')return renderDay();if(DET==='__todo'){$('#detc').innerHTML='<button class="cl" data-a="cd">关闭</button><h2>待办事项</h2><p class="pp">按重要程度排好了，置顶的在最前面。</p>'+todoHtml();return}if(DET==='__cd'){$('#detc').innerHTML='<button class="cl" data-a="cd">关闭</button><h2>倒计时</h2><p class="pp">设置了时间的话，会精确到小时和分钟。</p>'+cdHtml();return}const p=P(DET);if(!p)return;let b=`<button class="cl" data-a="cd">关闭</button><h2>${esc(p.name)}</h2>`;
if(DET==='vocab'){const dl=due(),ls=Object.keys(LISTS).sort(),lc=Object.keys(S.learned).length;b+=`<div class="tabs2">${[['words','词表'],['cards','背词卡'],['learn','测验'],['rev','复习'+(dl.length?' '+dl.length:'')],['mis','错题 '+S.wrong.length],['map','进度']].map(([k,t])=>`<button class="${V.tab===k?'on':''}" data-a="vt" data-v="${k}">${t}</button>`).join('')}</div>`;

av(v){selAv=v;manage()},avdel(v){if(S.custom.includes(v))S.custom=S.custom.filter(x=>x!==v);else if(!S.hid.includes(v))S.hid.push(v);if(selAv===v)selAv=AVK.filter(k=>!S.hid.includes(k)).concat(S.custom)[0]||'a02';save();manage();toast('这个头像已经删除啦')},avreset(){S.hid=[];save();manage();toast('默认头像已经恢复')},upav(){$('#avf').click()},add(){const n=$('#nn').value.trim();if(!n)return toast('先写项目名称哦');S.projects.push(mk('c'+Date.now(),n,$('#ng').value.trim()||'每天完成一次',selAv,'#d78ac5'));save();render();toast('新项目已添加')},
