const GD={"ㅡ 불규칙":{"m":"词干以 ㅡ 结尾的形容词、动词（쓰다、바쁘다、예쁘다、아프다…），后面接 아/어 开头的词尾时，ㅡ 会脱落。","c":"ㅡ 是很弱的元音，遇到 아/어 会被“吞掉”，只留下前面的辅音，再和 아/어 合成一个音节。所以看到 -아/어요、-아/어서、-았/었어요、-아/어 주세요 这类词尾，就要想到它。","r":"① 先去掉词干的 ㅡ（쓰→ㅆ，바쁘→바ㅃ）。\n② 看 ㅡ 前面那个音节的元音：是 ㅏ 或 ㅗ 就接 아，其他接 어。\n③ 只有一个音节的词干（쓰다、크다、끄다），前面没有音节可看，一律接 어。\n\n쓰다 → 써요　크다 → 커요　끄다 → 꺼요\n바쁘다 → 바빠요　아프다 → 아파요　나쁘다 → 나빠요　고프다 → 고파요\n예쁘다 → 예뻐요　기쁘다 → 기뻐요　슬프다 → 슬퍼요","e":[["요즘 너무 {바빠요}.","最近太忙了。"],["배가 {고파서} 빵을 먹었어요.","肚子饿了，所以吃了面包。"],["어제 편지를 {썼어요}.","昨天写了信。"]],"x":"和 르 불규칙容易混：르 불규칙会多出一个 ㄹ（모르다→몰라요），ㅡ 불규칙没有。\n凡是以 아/어 开头的词尾都同样处理：-아/어요、-아/어서、-았/었어요、-아/어 보다、-아/어 주세요。","n":"① 接 -고、-지만、-네요 等不以 아/어 开头的词尾时不变：바쁘고、바쁘지만。\n② 过去时同样规则：바빴어요、예뻤어요、썼어요（先脱落 ㅡ，再加 았/었）。\n③ 쓰다 有“写、用、戴、苦”几个意思，变化都是 써요。\n④ 以元音结尾的词干接 -(으)면 时不加 으：바쁘면、예쁘면。"},"ㄹ 불규칙":{"m":"词干以 ㄹ 结尾的用言（살다、만들다、알다、놀다、멀다、팔다…），后面接以 ㄴ、ㅂ、ㅅ 开头的词尾时，ㄹ 会脱落。","c":"遇到 -ㅂ니다/습니다、-(으)세요、-는、-(으)ㄴ、-(으)니까、-(으)ㄴ데 这类词尾时，词干的 ㄹ 要去掉。接 아/어、-고、-지만、-(으)면 时，ㄹ 不脱落。","r":"① 后面是 ㅂ：살다 → 삽니다　놀다 → 놉니다\n② 后面是 ㅅ：살다 → 사세요　만들다 → 만드세요　알다 → 아세요\n③ 后面是 ㄴ：살다 → 사는、사니까　멀다 → 먼 곳　팔다 → 파는\n④ 不脱落：살아요、살고、살지만、살면\n⑤ -(으)ㄹ 类词尾（-(으)ㄹ 거예요、-(으)ㄹ까요?、-(으)ㄹ래요）：词干已经是 ㄹ，直接接，不再加 으：살 거예요、만들 거예요","e":[["저는 서울에 {삽니다}.","我住在首尔。"],["할머니가 김치를 {만드세요}.","奶奶做泡菜。"],["먼 곳에 {사는} 친구를 만났어요.","见了住在远处的朋友。"]],"x":"相关：-ㅂ니다/습니다（正式语体）、-(으)세요、-는（现在时冠词形）、-(으)니까。\n和 ㅂ、ㄷ 不规则对比：ㅂ、ㄷ 是遇到元音才变，ㄹ 是遇到 ㄴ、ㅂ、ㅅ 才脱落。","n":"① 接 아/어 时 ㄹ 不脱落：살아요（不是 사요）、만들어요。\n② 常见的词：살다、알다、만들다、놀다、팔다、열다、멀다、걸다、울다、길다、달다、힘들다。\n③ 脱落后的 -세요 要特别留意：알다→아세요，놀다→노세요，팔다→파세요。"},"ㅂ 불규칙":{"m":"部分词干以 ㅂ 结尾的形容词和动词（춥다、덥다、어렵다、쉽다、맵다…），后面接以元音开头的词尾时，ㅂ 变成 우。","c":"接 -아/어요、-(으)면、-(으)니까、-(으)ㄴ 这类以元音（含 으）开头的词尾时，ㅂ→우。接辅音开头的词尾（-고、-지만、-네요、-습니다）时不变。","r":"① ㅂ → 우，再和 아/어 合成：춥다 → 추워요（추+우+어요）\n② 后面接 (으) 词尾：추운 날씨、추우면、추우니까\n③ 돕다、곱다 是特例：ㅂ→오，再接 아：도와요、고와요\n\n덥다 → 더워요　어렵다 → 어려워요　쉽다 → 쉬워요　맵다 → 매워요\n가깝다 → 가까워요　무겁다 → 무거워요　고맙다 → 고마워요　아름답다 → 아름다워요","e":[["오늘은 정말 {추워요}.","今天真冷。"],["이 문제는 {어려워서} 못 풀겠어요.","这道题太难了，解不出来。"],["친구가 이사를 {도와줬어요}.","朋友帮我搬家了。"]],"x":"规则的 ㅂ 받침不变化：입다 → 입어요、좁다 → 좁아요、잡다 → 잡아요、뽑다、씹다、접다。\n其他以元音开头的词尾都同样处理：-아/어서、-았/었어요、-아/어 보다。","n":"① 过去时：추웠어요、어려웠어요、도왔어요。\n② 돕다 是 도와요，不是 도우어요。\n③ 입다（穿）、좁다（窄）是规则的，要和不规则的成对记。\n④ 接辅音词尾不变：춥고、춥지만、어렵네요。"},"ㄷ 불규칙":{"m":"少数动词词干以 ㄷ 结尾（듣다、걷다、묻다（问）、싣다、깨닫다），后面接以元音开头的词尾时，ㄷ 变成 ㄹ。","c":"和 ㅂ 不规则相似：只有遇到元音才变，遇到辅音词尾不变（듣고、걷지만）。只有动词，没有形容词。","r":"듣다 → 들어요、들으세요、들으면、들은\n걷다 → 걸어요、걸으니까、걸은\n묻다（问）→ 물어요、물어보세요\n싣다 → 실어요\n深层规则：ㄷ→ㄹ 之后，再接 아/어 或 (으)。","e":[["저는 매일 음악을 {들어요}.","我每天听音乐。"],["공원에서 천천히 {걸었어요}.","在公园里慢慢走了。"],["모르면 선생님께 {물어보세요}.","不懂的话请问老师。"]],"x":"规则的 ㄷ 받침：받다 → 받아요、닫다 → 닫아요、믿다 → 믿어요、얻다 → 얻어요、쏟다。","n":"① 묻다 有两个：“问”（ㄷ 不规则，물어요）和“埋、沾上”（规则，묻어요）。\n② 듣다 接 -(으)면 是 들으면（ㄹ + 으），不是 들면（들면 是 들다 的活用）。\n③ 常用的不规则词：듣다、걷다、묻다、싣다、깨닫다，其余大多规则。"},"르 불규칙":{"m":"词干以 르 结尾的部分用言，接 아/어 时，르 里的 ㅡ 脱落，同时前一个音节要加 ㄹ 받침，ㄹ 又和 아/어 合成 라/러。","c":"和 ㅡ 不规则一样遇 아/어 才变，但这里多出一个 ㄹ：모르다 → 몰라요，而不是 모라요。","r":"① 去掉 르 的 ㅡ，把 ㄹ 加到前一个音节下面：모르 → 몰ㄹ\n② 前一个音节元音是 ㅏ/ㅗ → 라；其他 → 러\n\n모르다 → 몰라요　다르다 → 달라요　빠르다 → 빨라요　고르다 → 골라요\n부르다 → 불러요　자르다 → 잘라요　누르다 → 눌러요　흐르다 → 흘러요","e":[["저는 그 사람 이름을 {몰라요}.","我不知道那个人的名字。"],["두 형제는 성격이 {달라요}.","两兄弟性格不一样。"],["어제 노래를 {불렀어요}.","昨天唱了歌。"]],"x":"容易混的是 ㅡ 不规则：따르다 → 따라요、들르다 → 들러요、치르다 → 치러요（只脱落 ㅡ，没有多出 ㄹ）。\n另有 러 불규칙：이르다（到达）→ 이르러요、푸르다 → 푸르러요。","n":"① 过去时：몰랐어요、달랐어요、불렀어요。\n② 빠르다 + -아/어서 → 빨라서。\n③ 接 -고、-지만、-(으)면 不变：모르고、모르면、다르지만。"},"ㅎ 불규칙":{"m":"以 ㅎ 结尾的形容词（빨갛다、파랗다、노랗다、하얗다、까맣다，以及 이렇다、그렇다、어떻다），接 (으) 开头的词尾时 ㅎ 脱落；接 아/어 时 ㅎ 脱落，并且和 아/어 合成 ㅐ。","c":"主要是“颜色形容词”和“这样/那样/怎样”。看到 -아/어요 变成 -애요 的形式，或 -(으)ㄴ 冠词形变成 빨간、파란 时，就是它。","r":"① 接 -(으)ㄴ、-(으)면、-(으)니까：빨갛다 → 빨간、빨가면、빨가니까\n② 接 아/어：빨갛다 → 빨개요　파랗다 → 파래요　노랗다 → 노래요\n　하얗다 → 하얘요　까맣다 → 까매요　그렇다 → 그래요　어떻다 → 어때요\n③ 接辅音词尾不变：빨갛고、파랗지만","e":[["사과가 아주 {빨개요}.","苹果很红。"],["{파란} 하늘을 보세요.","请看蓝天。"],["그 영화 {어땠어요}?","那部电影怎么样？"]],"x":"规则的 ㅎ 받침：좋다 → 좋아요、많다 → 많아요、놓다 → 놓아요、넣다、낳다、닿다。\n相关常用形：그런、이런、저런、어떤、그래서、그러면。","n":"① 좋다 是规则的，别和 ㅎ 不规则弄混。\n② 只有形容词，没有动词。\n③ 하얗다 → 하얘요（ㅑ+ㅐ→ㅒ），过去：하얬어요。"},"ㅅ 불규칙":{"m":"少数动词（낫다、짓다、붓다、잇다、긋다、젓다）词干以 ㅅ 结尾，接以元音开头的词尾时，ㅅ 脱落。","c":"和 ㅂ、ㄷ 一样遇元音才变，遇辅音词尾不变（낫고、짓고）。ㅅ 脱落后两个元音不合并，仍分开写：나아요、지어요。","r":"낫다 → 나아요、나으면、나은\n짓다 → 지어요、지으세요、지은\n붓다 → 부어요　잇다 → 이어요　긋다 → 그어요　젓다 → 저어요","e":[["감기가 빨리 {나았어요}.","感冒很快就好了。"],["부모님이 새 집을 {지으셨어요}.","父母盖了新房子。"],["밥을 {지어서} 먹었어요.","做好饭吃了。"]],"x":"规则的 ㅅ 받침：웃다 → 웃어요、씻다 → 씻어요、벗다 → 벗어요、빼앗다。","n":"① 规则的比不规则的更常见，先把不规则的这 6 个背下来。\n② 낫다 有两个意思：“病好”（动词）和“比…好”（形容词），都是 ㅅ 不规则：더 나아요。\n③ 짓다 用法很多：집을 짓다（盖房）、밥을 짓다（做饭）、이름을 짓다（起名）。"},"现在时态 A/V-(스)ㅂ니다":{"m":"正式、礼貌的现在时陈述句结尾，常用于新闻、演讲、面试和工作场合。","c":"表示现在的状态、习惯或动作，语气比 -아/어요 更正式、更有距离感。疑问句用 -(스)ㅂ니까?。","r":"词干无收音 + ㅂ니다：가다 → 갑니다、마시다 → 마십니다\n词干有收音 + 습니다：먹다 → 먹습니다、읽다 → 읽습니다\n疑问句：갑니까? / 먹습니까?\nㄹ 收音先脱落再加 ㅂ니다：살다 → 삽니다、만들다 → 만듭니다\n이다 → 입니다，아니다 → 아닙니다，있다 → 있습니다","e":[["저는 학생{입니다}.","我是学生。"],["매일 아침 일곱 시에 {일어납니다}.","每天早上七点起床。"],["점심에 김밥을 {먹습니다}.","午饭吃紫菜包饭。"]],"x":"-아/어요（更口语的现在时）、-(으)십니다（敬语）、-(으)ㄹ 겁니다（将来、推测的正式形）。","n":"① 写作和正式场合多用，日常聊天多用 -아/어요。\n② 命令句、共动句的正式形另有 -(으)십시오、-(으)ㅂ시다。\n③ ㄹ 收音词干见“ㄹ 불규칙”：삽니다、압니다。"},"现在时态 A/V-아/어요":{"m":"最常用的非正式礼貌体现在时语尾，日常口语里随处可见，也可表示近期将来。","c":"表示现在的状态、习惯、动作；疑问句不改词尾，只靠句末语调上扬。","r":"最后一个元音是 ㅏ/ㅗ → -아요：가다 → 가요、앉다 → 앉아요、보다 → 봐요\n其他元音 → -어요：먹다 → 먹어요、읽다 → 읽어요\n하다 → 해요：공부하다 → 공부해요\n元音结尾会缩合：마시다 → 마셔요、오다 → 와요、주다 → 줘요\n이다 → 이에요/예요","e":[["저는 매일 커피를 {마셔요}.","我每天喝咖啡。"],["주말에 친구를 {만나요}.","周末见朋友。"],["이 책은 정말 {재미있어요}.","这本书真有意思。"]],"x":"-(스)ㅂ니다（更正式）、-았/었어요（过去）、-(으)ㄹ 거예요（将来）、-고 있어요（进行）。","n":"① 疑问句不改词尾：밥 먹어요?（吃饭吗？）\n② 也能表示近期将来：내일 만나요（明天见）。\n③ 不规则变化的词先变形再接 아/어요，见“不规则变化”。"},"过去时态 A/V-았/었어요":{"m":"表示过去发生的动作或存在过的状态。","c":"词干 + 았/었 + 어요；选 았 还是 었 的规则和 -아/어요 一样。形容词、이다 也用。","r":"最后元音 ㅏ/ㅗ → -았어요：가다 → 갔어요、보다 → 봤어요、앉다 → 앉았어요\n其他 → -었어요：먹다 → 먹었어요、마시다 → 마셨어요\n하다 → 했어요\n名词：N이었어요/였어요（의사 → 의사였어요）；否定：N이/가 아니었어요\n正式：-았/었습니다","e":[["어제 영화를 {봤어요}.","昨天看了电影。"],["아침에 빵을 {먹었어요}.","早上吃了面包。"],["지난주에 부산에 {갔어요}.","上周去了釜山。"]],"x":"-았/었었어요（过去完成）、-(으)ㄴ 적이 있다（经历）、-고 있었어요（过去进行）。","n":"① 形容词也用：어제는 추웠어요（昨天很冷）。\n② 不规则先变形再加 았/었：바쁘다 → 바빴어요、듣다 → 들었어요。\n③ 时间词常配合：어제、지난주、작년。"},"将来时态 V-(으)ㄹ 거예요":{"m":"表示将来的计划、打算，也可表示对将来或别人的推测。","c":"第一人称多表计划（我打算…），第三人称或天气等多表推测（应该会…）。","r":"无收音 + ㄹ 거예요：가다 → 갈 거예요、보다 → 볼 거예요\n有收音 + 을 거예요：먹다 → 먹을 거예요、읽다 → 읽을 거예요\nㄹ 收音不再加：살다 → 살 거예요、만들다 → 만들 거예요\n不规则：듣다 → 들을 거예요、돕다 → 도울 거예요\n疑问：주말에 뭐 할 거예요?","e":[["내일 친구를 {만날 거예요}.","明天我要见朋友。"],["주말에 집에서 {쉴 거예요}.","周末打算在家休息。"],["내일은 비가 {올 거예요}.","明天应该会下雨。"]],"x":"-겠어요（当场的决心、较强的推测）、-(으)려고 하다（打算）、-(으)ㄹ게요（承诺）、-(으)ㄹ 것 같다（好像）。","n":"① 问对方计划时用 -(으)ㄹ 거예요?，但对长辈更常换成 -(으)실 거예요?。\n② 推测别人的想法，更常用 -(으)ㄹ 것 같다。\n③ 近期将来口语里也可以直接用 -아/어요。"},"进行时态 V-고 있다":{"m":"表示动作正在进行；也可表示某种状态在持续，或穿戴着某物。","c":"强调“此刻正在做”或“最近一直在做”。敬语是 -고 계시다。","r":"动词词干 + 고 있다（不用区分收音）：먹다 → 먹고 있어요、공부하다 → 공부하고 있어요\n过去进行：먹고 있었어요\n敬语：하고 계세요","e":[["지금 밥을 {먹고 있어요}.","现在正在吃饭。"],["동생은 방에서 숙제를 {하고 있어요}.","弟弟正在房间写作业。"],["어제 전화했을 때 뭐 {하고 있었어요}?","昨天打电话的时候你在做什么？"]],"x":"-아/어 있다（动作结果的状态）、-는 중이다（正在…）、-고 계시다（敬语）。","n":"① 穿戴类动词用 -고 있다 表示“穿着、戴着”：모자를 쓰고 있어요（戴着帽子）。\n② 和 -아/어 있다 的区别：-고 있다 强调动作，-아/어 있다 强调动作完成后的状态（앉아 있다）。\n③ 形容词一般不用 -고 있다。"},"过去完成时态 A/V-았/었었어요":{"m":"表示事情发生在过去，而且现在情况已经不同了（动作或状态已不持续）。","c":"强调“过去有过，现在没有了”，或比另一个过去时间更早的事。","r":"在 -았/었어요 的基础上再加一个 었：가다 → 갔었어요、먹다 → 먹었었어요、살다 → 살았었어요、하다 → 했었어요","e":[["저는 어릴 때 부산에 {살았었어요}.","我小时候住过釜山。（现在不住了）"],["작년에 이 식당에 {왔었어요}.","去年来过这家餐厅。"],["전에는 머리가 {길었었어요}.","以前头发是长的。（现在不长了）"]],"x":"-았/었어요（单纯的过去）、-(으)ㄴ 적이 있다（经历）、-던（回想）。","n":"① 只在强调“和现在不同”时用，不是所有过去的事都要用它。\n② 日常口语里直接用 -았/었어요 就够了。\n③ 想说“有过某种经历”，用 -(으)ㄴ 적이 있다 更自然。"},"A/V-(으)니까":{"m":"表示理由（因为…所以…），后面常接命令、建议；也可表示“做了…之后发现…”。","c":"① 理由：说话人认为对方也容易理解的理由，后句可以是命令、共动、提议。\n② 发现：V-(으)니까 + 发现的结果，表示做了某事才发现。","r":"无收音 + 니까：가다 → 가니까、비싸다 → 비싸니까\n有收音 + 으니까：먹다 → 먹으니까、좋다 → 좋으니까\nㄹ 收音脱落：살다 → 사니까\n过去：-았/었으니까：어제 늦게 잤으니까 피곤해요\n名词：N(이)니까","e":[["비가 {오니까} 우산을 가져가세요.","因为下雨，请带伞。"],["시간이 없{으니까} 택시를 탑시다.","没时间了，打车吧。"],["집에 {가니까} 아무도 없었어요.","回到家发现一个人也没有。"]],"x":"-아/어서（也表理由，但后面不能接命令、共动句）、-기 때문에、N 때문에。","n":"① 后句是命令（-(으)세요）、共动（-(으)ㅂ시다、-(으)ㄹ까요?）时，只能用 -(으)니까，不能用 -아/어서。\n② -아/어서 前不能加时态，-(으)니까 前可以加：-았/었으니까。\n③ 不规则：춥다 → 추우니까、듣다 → 들으니까。"},"A-군요, V-는군요":{"m":"表示对刚刚得知、发现的事实的感叹（“原来…啊”）。","c":"说话人通过观察或听说，刚刚才知道某件事，带有惊讶、感叹的语气。","r":"形容词：词干 + 군요：예쁘다 → 예쁘군요、비싸다 → 비싸군요\n动词：词干 + 는군요：먹다 → 먹는군요、가다 → 가는군요（ㄹ 收音：살다 → 사는군요）\n过去：-았/었군요：갔군요、먹었군요\n名词：N(이)군요（학생이군요、의사군요）","e":[["여기 경치가 정말 {좋군요}.","这里风景真好啊。"],["한국말을 정말 잘 {하시는군요}.","您韩语说得真好啊。"],["벌써 {왔군요}.","已经来了啊。"]],"x":"-네요（同样表发现，更口语、更常用）、-(으)ㄴ/는데요（委婉的感叹或说明）。","n":"① -군요 偏“恍然大悟”，-네요 更口语。\n② 一般不用于说话人早就知道的事，也不用于说自己的意志。\n③ ㄹ 收音动词：사는군요、만드는군요。"},"안 A/V-아/어요 (A/V-지 않아요)":{"m":"表示“不…”，单纯否定某个动作或状态，常带有“主观上不想做”的意思。","c":"안 + 动词/形容词，或 词干 + 지 않다，两种意思一样。안 更口语，-지 않다 更书面、更正式。","r":"안 + A/V：안 가요、안 먹어요、안 예뻐요\n-지 않다：가지 않아요、먹지 않아요、예쁘지 않아요\n名词 + 하다：공부 안 해요（안 放在 하다 前面）、공부하지 않아요\n좋아하다 这类本身就是动词的词：안 좋아해요\n过去：안 갔어요 / 가지 않았어요\n正式：가지 않습니다","e":[["저는 고기를 {안 먹어요}.","我不吃肉。"],["오늘은 날씨가 {안 좋아요}.","今天天气不好。"],["주말에는 학교에 {가지 않아요}.","周末不去学校。"]],"x":"못 V-아/어요（客观上做不到）、-지 마세요（请不要）、-지 않아도 되다（不必…）。","n":"① 안 表示“不想做/没做”，못 表示“想做但做不到”，要分清。\n② 命令句、共动句不能用 안，要用 -지 마세요、-지 맙시다。\n③ 공부하다 这类“名词 + 하다”：공부 안 해요，不是 안 공부해요。"},"못 V-아/어요 (V-지 못해요)":{"m":"表示“不能、做不到”，因为能力不足或客观原因无法做某事。","c":"못 + 动词，或 动词词干 + 지 못하다。只用于动词，形容词没有“做不到”的说法。","r":"못 + V：못 가요、못 먹어요\n-지 못하다：가지 못해요、먹지 못해요\n名词 + 하다：운동 못 해요（못 放在 하다 前面）\n过去：못 갔어요 / 가지 못했어요\n正式：가지 못합니다","e":[["저는 수영을 {못 해요}.","我不会游泳。"],["감기에 걸려서 학교에 {못 갔어요}.","因为感冒没能去学校。"],["너무 매워서 {먹지 못해요}.","太辣了，吃不了。"]],"x":"안 A/V（主观不做）、-(으)ㄹ 수 없다（不能，更正式）、-(으)ㄹ 줄 모르다（不会，没学过）。","n":"① 안 갔어요 = 没去（不想去或没去）；못 갔어요 = 想去却没能去。\n② 形容词不用 못，说“不…”用 안：안 커요。\n③ 못 前面可以加原因：아파서 못 갔어요。"},"词汇否定 아니다/없다/모르다":{"m":"有三组词本身带否定意义，直接代替“안/못”：아니다（不是）、없다（没有）、모르다（不知道、不认识）。","c":"这三个词和肯定形成对：이다 ↔ 아니다、있다 ↔ 없다、알다 ↔ 모르다，说否定时不需要再加 안。","r":"N이다 → N이/가 아니다：학생이에요 → 학생이 아니에요\n있다 → 없다：시간이 있어요 → 시간이 없어요\n알다 → 모르다：알아요 → 몰라요（모르다 是 르 불규칙）","e":[["저는 학생{이 아니에요}.","我不是学生。"],["오늘은 시간이 {없어요}.","今天没有时间。"],["저는 그 사람을 {몰라요}.","我不认识那个人。"]],"x":"안 A/V（普通否定）、르 불규칙（모르다 → 몰라요）、-이/가 되다。","n":"① 아니다 前面的名词接 이/가，不用 은/는、을/를：학생이 아니에요。\n② 说“没有”用 없다，不说 안 있어요。\n③ 맛있다/맛없다、재미있다/재미없다 的否定直接用 없다 形式。"},"N 이/가":{"m":"主格助词，标示句子的主语；也用于强调主语或引入新信息。","c":"标出“谁做了/什么是”。第一次提到的新信息、疑问词做主语、强调主语时常用，和 은/는 相对。","r":"无收音名词 + 가：친구 → 친구가\n有收音名词 + 이：학생 → 학생이\n特殊：나 → 내가、저 → 제가、너 → 네가、누구 → 누가\n敬语：N께서（선생님께서）","e":[["오늘은 비{가} 와요.","今天下雨。"],["동생{이} 학교에 가요.","弟弟去学校。"],["{제가} 할게요.","我来做。"]],"x":"N 은/는（话题）、N 이/가 아니다、N께서（敬语主格）。","n":"① 回答“谁”用 이/가：누가 했어요? 제가 했어요。说明话题、做对比用 은/는：저는 학생이에요。\n② 있다/없다、되다、아니다 前面的名词用 이/가：시간이 없어요。\n③ 나/저/너 接 가 时变成 내가/제가/네가。"},"N 은/는":{"m":"补助词，表示话题或对比。","c":"提出“关于…”的话题，或把两个事物放在一起对比，也用于已经知道的旧信息。","r":"无收音 + 는：저 → 저는、친구 → 친구는\n有收音 + 은：학생 → 학생은、책 → 책은\n对比：고기는 먹어요. 생선은 안 먹어요.","e":[["저{는} 학생이에요.","我是学生。"],["커피{는} 마시지만 차는 안 마셔요.","咖啡喝，但茶不喝。"],["이 식당{은} 음식이 맛있어요.","这家餐厅饭菜好吃。"]],"x":"N 이/가（主语）、N 도（也）、N 만（只）。","n":"① 和 이/가 的区别：说话人想谈“关于谁/什么”时用 은/는；回答“谁”时用 이/가。\n② 和 도、만 不能叠加：저도（不是 저는도）。\n③ 口语里 은/는、이/가、을/를 常常省略。"},"N 을/를":{"m":"宾格助词，表示动作的对象（宾语）。","c":"放在宾语后面，后面接及物动词：먹다、보다、읽다、만나다、마시다。","r":"无收音 + 를：커피 → 커피를\n有收音 + 을：밥 → 밥을\n口语常省略：밥 먹었어요?","e":[["저는 매일 커피{를} 마셔요.","我每天喝咖啡。"],["주말에 영화{를} 봤어요.","周末看了电影。"],["친구{를} 만나러 가요.","去见朋友。"]],"x":"N 이/가（主语）、N 에게/한테（对象）、N 와/과（一起）。","n":"① 좋아하다 的对象用 을/를：한국 음식을 좋아해요；좋다 的对象用 이/가：한국 음식이 좋아요。\n② 有些动词的对象不用 을/를：친구에게 전화하다、선생님께 묻다。\n③ 去向用 에，不用 을/를：학교에 가요。"},"N 에":{"m":"表示时间、去向、存在的位置、无生命的对象、基准等。","c":"常见用法：① 时间点（7시에、토요일에）② 去向（학교에 가요）③ 存在位置（책상 위에 있어요）④ 无生命对象（꽃에 물을 주다）⑤ 基准（하루에 세 번）。","r":"时间：아침에、주말에、7시에\n去向：학교에 가다、집에 오다\n位置：집에 있다、서울에 살다\n对象：꽃에 물을 주다\n基准：하루에 세 번、한 달에 한 번","e":[["저는 아침 7시{에} 일어나요.","我早上七点起床。"],["내일 학교{에} 가요.","明天去学校。"],["책이 책상 위{에} 있어요.","书在桌子上。"]],"x":"N 에서（动作发生的地点、出发点）、N 에게/한테（对象是人/动物）、N (으)로（方向、手段）。","n":"① 어제、오늘、내일、지금、언제 后面不加 에。\n② 对象是人用 에게/한테，是物用 에。\n③ 去向用 에（학교에 가요），动作发生的地点用 에서（학교에서 공부해요）。"},"N 에서":{"m":"表示动作发生的地点，也表示出发点（从…）。","c":"① “在…（做某事）”：动作发生的地点；② “从…”：出发点，常与 까지 配合；③ 表示组织、团体做主语（회사에서）。","r":"地点 + 에서：도서관에서 공부해요\n出发点：집에서 학교까지 걸어요\n组织做主语：회사에서 발표했어요","e":[["도서관{에서} 공부해요.","在图书馆学习。"],["집{에서} 회사까지 한 시간 걸려요.","从家到公司要一个小时。"],["친구하고 식당{에서} 점심을 먹었어요.","和朋友在餐厅吃了午饭。"]],"x":"N 에（存在位置、去向）、N 부터 N 까지（时间范围）、N 에서 N 까지（距离范围）。","n":"① 있다/없다 用 에：집에 있어요，不说 집에서 있어요。\n② 에 表去向、存在；에서 表动作发生的地点。\n③ “从”还可以加强调：집에서부터 걸어왔어요。"},"N 도":{"m":"“也、都”，表示同样、添加；也可用来强调“连…也”。","c":"用来替换 은/는、이/가、을/를，表示“同样的情况也成立”。","r":"替换 이/가、은/는、을/를（不能叠加）：저는 학생이에요. 친구도 학생이에요.\n可接在 에、에서、에게、(으)로 后面：학교에도 가요、집에서도 해요\n疑问词 + 도 + 否定：아무도 없어요、하나도 몰라요","e":[["저는 학생이에요. 친구{도} 학생이에요.","我是学生，朋友也是学生。"],["이 가방은 싸고 질{도} 좋아요.","这个包便宜，质量也好。"],["시간이 하나{도} 없어요.","一点时间也没有。"]],"x":"N 은/는（话题）、N 만（只）、N 까지（连…都）。","n":"① 不能和 이/가、은/는、을/를 叠加：친구도（不是 친구도가）。\n② 에、에서、에게、(으)로 后面可以再加 도：학교에도 가요。\n③ 疑问词 + 도 + 否定表示“都不”：아무도 없어요、아무것도 안 먹었어요。"},"N 만":{"m":"“只、仅仅”，限定范围。","c":"表示只限于这一个，排除其他。可以替换 이/가、을/를，也可接在 에、에게、(으)로 后面。","r":"名词 + 만（不分收音）：저만、물만、아침에만\n替换 이/가、을/를：동생만 갔어요、물만 마셔요\n叠加在其他助词后：주말에만、친구에게만","e":[["저는 물{만} 마셔요.","我只喝水。"],["주말{에만} 운동해요.","只在周末运动。"],["동생{만} 학교에 갔어요.","只有弟弟去了学校。"]],"x":"N 밖에（只有…，后面接否定）、N 뿐（仅仅是）、N 도（也）。","n":"① 만 后接肯定，밖에 后必须接否定：물만 있어요 = 물밖에 없어요。\n② 만 可以替换 이/가、을/를，但接在 에、에게 后面时是叠加。\n③ -기만 하다 = 只是…：울기만 해요（只是哭）。"},"N 의":{"m":"“的”，表示所属、所有或关系。","c":"A의 B = A 的 B。口语里常常省略，发音时多读作 [에]。","r":"나의 → 내、저의 → 제、너의 → 네\nN1의 N2：선생님의 가방、한국의 수도\n口语省略：친구 가방、엄마 생일\n“我们的”一般直接说：우리 집、우리 학교","e":[["이것은 {제} 책이에요.","这是我的书。"],["{선생님의} 가방이 어디에 있어요?","老师的包在哪里？"],["한국{의} 수도는 서울이에요.","韩国的首都是首尔。"]],"x":"N 이/가（主语）、나/저 → 내/제（缩略形）、우리（我们的）。","n":"① 口语里常省略 의，书面语和强调所属时才写出来。\n② 나의、저의、너의 常缩写成 내、제、네。\n③ 不要和 에 混：N의 N 表示“…的”，N에 表示时间、地点。"},"N 에게/한테":{"m":"“对…、给…”，对象是人或动物。","c":"表示动作的接受者。한테 更口语，에게 更书面；对长辈用敬语 께。","r":"친구에게 / 친구한테 선물을 줘요\n敬语：선생님께 드려요\n“从…（得到）”：친구한테서 / 친구에게서 받다","e":[["친구{한테} 선물을 줬어요.","给了朋友礼物。"],["동생{에게} 전화했어요.","给弟弟打了电话。"],["선생님{께} 질문했어요.","向老师提了问题。"]],"x":"N 에（无生命的对象）、N 한테서/에게서（来源）、N 께（敬语）。","n":"① 对象是物或地点时用 에：꽃에 물을 줘요、회사에 전화했어요。\n② 한테 多用于口语，论文、书面语用 에게。\n③ “从某人那里得到”用 한테서/에게서：친구한테서 선물을 받았어요。"},"N 와/과, N (이)랑, N 하고":{"m":"“和、与”，连接名词；也表示“一起（做）”的对象。","c":"三者意思相同：와/과 偏书面，(이)랑 最口语，하고 通用。","r":"无收音 + 와 / 有收音 + 과：친구와、학생과\n无收音 + 랑 / 有收音 + 이랑：친구랑、학생이랑\n하고（不分收音）：친구하고、학생하고\n一起：N와/과 같이、N하고 같이","e":[["빵{하고} 우유를 샀어요.","买了面包和牛奶。"],["친구{랑} 영화를 봤어요.","和朋友看了电影。"],["저는 동생{과} 같이 살아요.","我和弟弟一起住。"]],"x":"N 도（也）、-고（连接动词或句子）、N 하고 같이。","n":"① 这三个只能连接名词；连接动词、形容词要用 -고。\n② 连接多个名词时，最后一个名词后面不再加：빵하고 우유（不是 우유하고）。\n③ 正式书面多用 와/과，口语多用 (이)랑、하고。"},"N (으)로":{"m":"表示方向（朝…）、手段工具（用…）、材料、资格身份、变化的结果。","c":"① 方向：학교로 가요  ② 手段：버스로 가요、젓가락으로 먹어요  ③ 材料：나무로 만들었어요  ④ 资格：선생님으로 일해요  ⑤ 结果：얼음으로 변했어요。","r":"无收音或 ㄹ 收音 + 로：버스로、지하철로、서울로\n有收音（ㄹ 除外）+ 으로：손으로、젓가락으로、한국어로","e":[["지하철{로} 학교에 가요.","坐地铁去学校。"],["젓가락{으로} 밥을 먹어요.","用筷子吃饭。"],["이쪽{으로} 오세요.","请往这边来。"]],"x":"N 에（到达点）、N 에서（出发点）、N 에게/한테（对象）。","n":"① ㄹ 收音的名词接 로，不接 으로：지하철로、서울로。\n② 和 에 的区别：에 是到达点（학교에 가요），(으)로 强调方向（학교로 가요，朝着学校走）。\n③ 语言用 (으)로：한국어로 말해요（用韩语说）。"},"N 보다":{"m":"“比…”，用于比较。","c":"A는 B보다 + 形容词/副词：A 比 B 更…。经常搭配 더、훨씬。","r":"N1은/는 N2보다 + A：저는 동생보다 키가 커요\n强调：더、훨씬、조금 더\n否定比较：덜（不如）\n不分收音，直接加在名词后面","e":[["이 가방이 저 가방{보다} 더 비싸요.","这个包比那个包贵。"],["오늘은 어제{보다} 추워요.","今天比昨天冷。"],["저는 형{보다} 키가 작아요.","我比哥哥个子矮。"]],"x":"N 처럼/같이（像…一样）、N 만큼（和…一样）、가장/제일（最）。","n":"① 보다 前面是比较的基准：基准 + 보다 + 结果。\n② 常配 더、훨씬：훨씬 더 커요。\n③ -보다는 强调对比：이것보다는 저것이 좋아요。"},"N 마다":{"m":"“每…、每一个…”。","c":"表示“每一个、每一次”，后面多是习惯或规律；时间名词 + 마다 也表示“每隔…”。","r":"名词 + 마다（不分收音）：주말마다、사람마다\n时间：아침마다 = 每天早上\n间隔：한 시간마다 = 每隔一小时\n常配 다、모두：학생마다 다 달라요","e":[["저는 주말{마다} 등산해요.","我每个周末爬山。"],["사람{마다} 생각이 달라요.","每个人想法都不同。"],["한 시간{마다} 버스가 와요.","每隔一小时来一趟公交车。"]],"x":"매（每，매일、매주）、N 별로（按…分别）、N 마다 + 다（每个都…）。","n":"① 마다 和 매 意思相近：주말마다 = 매 주말，날마다 = 매일。\n② 时间 + 마다 常表示“每隔”：한 시간마다 = 每隔一小时。\n③ 后面常接 다/모두 加强：학생마다 다 달라요。"},"N 쯤":{"m":"“大约、左右”，表示时间、数量、程度的大概范围。","c":"贴在表示时间、数量的名词后面，说“大概是这个数”；疑问词后面表示“大概什么时候/多少”。","r":"时间、数量 + 쯤（不分收音）：세 시쯤、열 명쯤、이틀쯤\n疑问：몇 시쯤、언제쯤、얼마쯤","e":[["내일 오후 세 시{쯤} 만나요.","明天下午三点左右见面。"],["여기서 학교까지 십 분{쯤} 걸려요.","从这里到学校要十分钟左右。"],["{언제쯤} 도착해요?","大概什么时候到？"]],"x":"N 정도（大概、程度）、약（大约，书面）。","n":"① 쯤 和 정도 常可替换；쯤 更偏时间点，정도 更偏数量、程度。\n② 쯤 是接在名词后的成分，不空格：세 시쯤。\n③ 问“大概”时用：몇 시쯤、언제쯤。"},"N (이)나":{"m":"有三种常见意思：① “或者”（二选一）；② “竟然”（数量多、超出预期）；③ “不如…吧”（退而求其次的选择）。","c":"要根据语境判断是哪一种意思。","r":"无收音 + 나：커피나、차나\n有收音 + 이나：밥이나、빵이나\n① N1(이)나 N2：커피나 차를 마셔요（咖啡或茶）\n② 数量 + (이)나：세 시간이나 기다렸어요（竟等了三小时）\n③ 提议：심심한데 영화나 볼까요?","e":[["커피{나} 차를 마시고 싶어요.","想喝咖啡或茶。"],["세 시간{이나} 기다렸어요.","竟然等了三个小时。"],["심심한데 영화{나} 볼까요?","好无聊，要不看个电影？"]],"x":"N (이)든지（无论…）、N (이)라도（即使…也）、N 도（也）、N 밖에（只有）。","n":"① “或”的用法可以只在第一个名词后加，也可两个都加：커피나 차나。\n② 数量多时用 (이)나 带惊讶，数量少时用 밖에/만。\n③ 提议用法很随意，不适合很正式的场合。"},"N 밖에":{"m":"“只有、除了…之外没有”，后面必须接否定。","c":"表示“只有这一个”，带有“太少、不够”的遗憾语气。","r":"名词 + 밖에（不分收音）+ 否定（없다、안、못、모르다）\n돈이 천 원밖에 없어요\n하나밖에 몰라요","e":[["지갑에 돈이 천 원{밖에} 없어요.","钱包里只有一千韩元。"],["오늘은 두 시간{밖에} 못 잤어요.","今天只睡了两个小时。"],["저는 한국어를 조금{밖에} 못 해요.","我只会一点点韩语。"]],"x":"N 만（只，肯定句）、N 뿐（仅仅是）。","n":"① 后面一定要接否定，不能接肯定句。\n② 밖에 有“太少、不够”的感觉，만 是中性的“只”：물만 있어요 / 물밖에 없어요。\n③ 밖에 还是“外面”这个词：집 밖에（家外面），靠语境分辨。"},"N 에서 N 까지, N 부터 N 까지":{"m":"“从…到…”，表示范围；에서…까지 多用于地点、距离，부터…까지 多用于时间。","c":"① 地点：집에서 학교까지  ② 时间：아홉 시부터 여섯 시까지  ③ 也可单独使用。","r":"地点 + 에서 + 地点 + 까지\n时间 + 부터 + 时间 + 까지\n单独使用：학교까지（到学校）、아침부터（从早上起）","e":[["집에서 학교{까지} 걸어서 십 분 걸려요.","从家到学校走路要十分钟。"],["아침 아홉 시{부터} 저녁 여섯 시까지 일해요.","从早上九点工作到晚上六点。"],["서울{에서} 부산까지 기차로 세 시간 걸려요.","从首尔到釜山坐火车要三小时。"]],"x":"N 에（时间点）、N 에서（地点）、N 동안（期间）。","n":"① 地点、距离多用 에서…까지，时间多用 부터…까지。\n② 까지 包含终点，意思是“到…为止”。\n③ 单独的 까지 还可表示“连…都”：아이들까지 와요。"},"N 처럼, N 같이":{"m":"“像…一样”，表示比喻或相似。","c":"两者意思相同，처럼 更常用。注意 같이 还有“一起”的意思，是另一个词。","r":"名词 + 처럼 / 같이（不分收音）：아이처럼、꽃같이\nN 처럼 + 动词/形容词：아이처럼 웃어요\nN 같은 + 名词：천사 같은 사람","e":[["그는 아이{처럼} 웃어요.","他像孩子一样笑。"],["너{같이} 예쁜 사람은 처음 봤어요.","第一次见到像你这样漂亮的人。"],["가수{처럼} 노래를 잘 불러요.","唱歌像歌手一样好。"]],"x":"N 같은 N（像…的）、N 만큼（和…一样的程度）、N 보다（比）。","n":"① 같이 也是副词“一起”：친구와 같이 가요（和朋友一起去），要看语境。\n② 修饰名词时用 같은：천사 같은 사람。\n③ 처럼 直接贴在名词后，不空格。"},"N 전에, V-기 전에":{"m":"“在…之前”。","c":"名词后加 전에；动词词干后加 -기 전에；时间长度后加 전에表示“…以前”。","r":"N + 전에：식사 전에、수업 전에\nV + 기 전에：자기 전에、먹기 전에\n时间长度 + 전에：삼 일 전에（三天前）\n前面不加时态","e":[["식사 {전에} 손을 씻어요.","饭前洗手。"],["자기 {전에} 책을 읽어요.","睡前看书。"],["삼 년 {전에} 한국에 왔어요.","三年前来到了韩国。"]],"x":"N 후에/V-(으)ㄴ 후에（之后）、V-(으)ㄴ 지（自从…）、전（名词：以前）。","n":"① -기 전에 前面不能加时态（不说 먹었기 전에）。\n② 时间长度 + 전에 = “…前”：이틀 전에。\n③ 整个句子的时态由主句决定。"},"N 후에, V-(으)ㄴ 후에":{"m":"“在…之后”。","c":"表示一件事结束之后，再发生另一件事。","r":"N + 후에：수업 후에、식사 후에\n无收音 V + ㄴ 후에：가다 → 간 후에\n有收音 V + 은 후에：먹다 → 먹은 후에\nㄹ 收音：살다 → 산 후에\n时间 + 후에：삼 일 후에","e":[["수업 {후에} 같이 점심을 먹어요.","下课后一起吃午饭。"],["밥을 {먹은 후에} 약을 드세요.","饭后请吃药。"],["일주일 {후에} 다시 만나요.","一周后再见。"]],"x":"V-고 나서（做完…之后）、V-아/어서（先后顺序）、N 전에（之前）。","n":"① 前面的动词要用过去冠词形 -(으)ㄴ，不能用 -는：먹은 후에。\n② “之后”口语也可说 뒤에：수업 뒤에。\n③ -(으)ㄴ 후에 强调时间先后，-고 나서 强调前一个动作做完。"},"V-고 나서":{"m":"“做完…之后（再）”，强调前一个动作完成。","c":"前后两个动作有先后顺序，前面的做完了才进行后面的。","r":"动词词干 + 고 나서（不分收音）：먹다 → 먹고 나서、끝나다 → 끝나고 나서\n前后主语可以不同\n只用于动词","e":[["숙제를 {하고 나서} 텔레비전을 봐요.","写完作业再看电视。"],["밥을 {먹고 나서} 커피를 마셔요.","吃完饭喝咖啡。"],["수업이 {끝나고 나서} 전화할게요.","下课后我打电话。"]],"x":"V-(으)ㄴ 후에（之后）、V-아/어서（先后顺序）、V-고（并列、顺序）。","n":"① 只能用于动词，不能用于形容词。\n② 和 -(으)ㄴ 후에 相近，-고 나서 更强调“前一个动作已经完成”。\n③ 前后主语可以不同，这是和 -아/어서（前后主语须相同）的区别之一。"},"N 때, A/V-(으)ㄹ 때":{"m":"“在…的时候”。","c":"表示某个时间点或某段时间，名词用 N 때，动词和形容词用 -(으)ㄹ 때。","r":"N + 때：점심 때、방학 때、시험 때\n无收音 + ㄹ 때：가다 → 갈 때\n有收音 + 을 때：먹다 → 먹을 때\nㄹ 收音：살다 → 살 때\n名词 + 이다：N일 때（학생일 때）","e":[["{어릴 때} 시골에서 살았어요.","小时候住在乡下。"],["밥을 {먹을 때} 텔레비전을 보지 마세요.","吃饭的时候不要看电视。"],["한국에 {갔을 때} 김치를 많이 먹었어요.","去韩国的时候吃了很多泡菜。"]],"x":"V-(으)면서（同时）、V-는 동안（期间）、V-자마자（一…就…）。","n":"① -(으)ㄹ 때 表示动作进行中或将要发生，-았/었을 때 表示动作已完成：한국에 갈 때（去的时候）、한국에 갔을 때（到了韩国的时候）。\n② 不规则要先变形：춥다 → 추울 때、듣다 → 들을 때。\n③ 名词直接接 때：방학 때，不需要 일。"},"V-아/어서":{"m":"“先…然后…”，表示前后动作的先后顺序，且联系紧密；前一个动作的结果会延续到后一个动作。","c":"前后主语必须相同；前面不加时态，时态加在句末。常见搭配：가서、와서、만나서、앉아서、사서。","r":"最后元音 ㅏ/ㅗ → -아서：가다 → 가서、사다 → 사서、앉다 → 앉아서\n其他 → -어서：먹다 → 먹어서、만나다 → 만나서、하다 → 해서","e":[["친구를 {만나서} 영화를 봤어요.","见了朋友，一起看了电影。"],["도서관에 {가서} 책을 빌렸어요.","去图书馆借了书。"],["의자에 {앉아서} 이야기해요.","坐在椅子上聊天。"]],"x":"V-고（单纯的先后）、V-고 나서（做完之后）、A/V-아/어서（表示理由，另一条语法）。","n":"① 前后主语必须相同。\n② 前面不能加 았/었：시간은 句末表示。\n③ 和 -고 的区别：-아/어서 前后动作联系紧密（시장에 가서 사다），-고 只是依次发生。"},"V-(으)면서":{"m":"“一边…一边…”，表示两个动作同时进行。","c":"前后主语必须相同，只用于动词；名词后用 N(이)면서，表示“既是…又是…”。","r":"无收音 + 면서：가다 → 가면서\n有收音 + 으면서：먹다 → 먹으면서\nㄹ 收音：살다 → 살면서\n名词：N(이)면서","e":[["음악을 {들으면서} 공부해요.","一边听音乐一边学习。"],["밥을 {먹으면서} 텔레비전을 봐요.","一边吃饭一边看电视。"],["그는 의사{이면서} 작가예요.","他既是医生又是作家。"]],"x":"V-는 동안（期间）、N 때/V-(으)ㄹ 때（的时候）、V-고（并列）。","n":"① 前后主语必须相同。\n② 时态加在句末，不加在 -(으)면서 前面。\n③ 不规则要先变形：듣다 → 들으면서。"},"N 중, V-는 중":{"m":"“正在…（中）”，表示某个动作或状态正在进行。","c":"强调“此时此刻正在做”，多用于动词和名词（회의 중、공사 중）。","r":"N + 중：회의 중、공사 중、통화 중\nV-는 중이다：먹는 중이에요、공부하는 중이에요","e":[["지금 회의 {중이에요}.","现在正在开会。"],["지금 밥을 {먹는 중이에요}.","现在正在吃饭。"],["사장님은 지금 식사 {중입니다}.","社长现在正在用餐。"]],"x":"V-고 있다（进行）、N 중에（在…之中）。","n":"① 只用于动词，形容词不用。\n② 和 -고 있다 相比，-는 중이다 更强调“此时此刻”。\n③ N 중에 另有“在…当中”的意思：이 중에 뭐가 제일 좋아요?"},"V-자마자":{"m":"“一…就…”，前一个动作刚结束，后一个动作立刻发生。","c":"前后动作紧挨着发生；前面不加时态；只用于动词。","r":"动词词干 + 자마자（不分收音）：도착하다 → 도착하자마자、일어나다 → 일어나자마자","e":[["집에 {도착하자마자} 샤워했어요.","一到家就洗了澡。"],["아침에 {일어나자마자} 물을 마셔요.","早上一起床就喝水。"],["수업이 {끝나자마자} 집에 갔어요.","一下课就回家了。"]],"x":"V-고 나서（之后）、V-는 대로（一…就…）、N 때（的时候）。","n":"① 前面不加时态，时态加在句末。\n② 前后主语可以不同。\n③ 后句一般不接命令句、共动句。"},"N 동안, V-는 동안":{"m":"“在…期间”，表示一段持续的时间。","c":"名词后加 동안，动词后加 -는 동안；也用在时间长度后面，表示“…（时长）”。","r":"N + 동안：방학 동안、두 시간 동안\nV-는 동안：공부하는 동안、기다리는 동안","e":[["방학 {동안} 한국에 있었어요.","放假期间一直在韩国。"],["제가 {자는 동안} 비가 왔어요.","我睡觉的时候下过雨。"],["두 시간 {동안} 기다렸어요.","等了两个小时。"]],"x":"V-(으)ㄹ 때（的时候）、V-(으)면서（一边…一边…）、N 중에。","n":"① 时间长度 + 동안 = “…（时长）”：세 시간 동안。\n② -는 동안 表示一段持续的时间，-(으)ㄹ 때 表示某个时点。\n③ 前后主语可以不同。"},"V-(으)ㄴ 지":{"m":"“自从…以来（已经过了…时间）”。","c":"前面是起点的事情，后面说经过了多长时间，常和 되다、지나다、넘다 搭配。","r":"无收音 + ㄴ 지：오다 → 온 지\n有收音 + 은 지：먹다 → 먹은 지\nㄹ 收音：살다 → 산 지\n结构：V-(으)ㄴ 지 + 时间 + 되다/지나다/넘다","e":[["한국에 {온 지} 일 년이 됐어요.","来韩国已经一年了。"],["한국어를 {공부한 지} 얼마나 됐어요?","学韩语多久了？"],["그 친구를 {만난 지} 오래됐어요.","见那个朋友已经很久了。"]],"x":"N 전에/후에、V-(으)ㄴ 적이 있다（经历）、N 동안（期间）。","n":"① 后句用 되다、지나다、넘다 等表示时间的经过：이 년이 되다。\n② 只用于动词。\n③ 前面要用 -(으)ㄴ，不能用现在时 -는。"},"V-고 싶다":{"m":"“想…”，表示说话人的愿望。","c":"用于第一、第二人称（我想…、你想…吗）；说第三人称时用 -고 싶어 하다。","r":"动词词干 + 고 싶다：가다 → 가고 싶어요、먹다 → 먹고 싶어요\n否定：-고 싶지 않다\n过去：-고 싶었어요\n第三人称：-고 싶어 하다","e":[["저는 한국에 {가고 싶어요}.","我想去韩国。"],["뭐 {먹고 싶어요}?","你想吃什么？"],["동생은 가수가 {되고 싶어 해요}.","弟弟想当歌手。"]],"x":"A/V-(으)면 좋겠다（希望…就好了）、V-고 싶어 하다（第三人称）。","n":"① 对象可以用 을/를，也可以用 이/가：물을 / 물이 마시고 싶어요。\n② 第三人称用 -고 싶어 하다，不直接说 -고 싶다。\n③ 只用于动词，形容词不用。"},"A/V-(으)면 좋겠다":{"m":"“如果…就好了”，表示希望或愿望。","c":"表达对某件事的期待、希望，可以用在自己或别人身上。-았/었으면 좋겠다 更常用，语气更强烈。","r":"无收音 + 면 좋겠다：오다 → 오면 좋겠다\n有收音 + 으면 좋겠다：먹다 → 먹으면 좋겠다\nㄹ 收音：살다 → 살면 좋겠다\n过去形（更常用）：-았/었으면 좋겠다","e":[["내일 비가 안 {왔으면 좋겠어요}.","希望明天不要下雨。"],["방학이 빨리 {오면 좋겠어요}.","希望假期快点来。"],["더 큰 집에서 {살았으면 좋겠어요}.","希望能住在更大的房子里。"]],"x":"V-고 싶다（想）、A/V-(으)면（如果）、-았/었으면 하다（更含蓄的希望）。","n":"① -았/었으면 좋겠다 比 -(으)면 좋겠다 更常用。\n② 可以用于别人的愿望：동생이 건강했으면 좋겠어요。\n③ 形容词也能用：날씨가 좋았으면 좋겠어요。"},"V-아/어 주세요, V-아/어 주시겠어요?":{"m":"请求对方为自己做某事（请…）；-아/어 주시겠어요? 是更礼貌的说法。","c":"动词 + 아/어 + 주세요，对方的行为是为“我”做的。","r":"最后元音 ㅏ/ㅗ → 아 주세요：도와 주세요、사 주세요\n其他 → 어 주세요：읽어 주세요、가르쳐 주세요\n하다 → 해 주세요\n更礼貌：-아/어 주시겠어요?\n请不要…：-지 말아 주세요","e":[["창문 좀 {열어 주세요}.","请帮我开一下窗户。"],["천천히 {말해 주시겠어요}?","能请您说慢一点吗？"],["사진 좀 {찍어 주세요}.","请帮我拍张照。"]],"x":"V-(으)세요（请…，让对方做）、V-아/어 줄게요（我帮你…）、V-(으)ㄹ래요?。","n":"① 주세요 单独用是“请给我”：물 주세요。\n② 对长辈请求时用 -아/어 주시겠어요? 更礼貌。\n③ “请不要…”要说 -지 말아 주세요。"},"V-아/어 줄게요, V-아/어 줄까요?":{"m":"줄게요：我来为你做…（承诺、提议）；줄까요?：要我帮你…吗？","c":"主语是说话人“我”，为对方做事。","r":"V-아/어 + 줄게요：도와 줄게요、가르쳐 줄게요\nV-아/어 + 줄까요?：들어 줄까요?\n对长辈：드릴게요 / 드릴까요?","e":[["제가 {도와 줄게요}.","我来帮你。"],["가방을 {들어 줄까요}?","要我帮你拿包吗？"],["내일 책을 {빌려 줄게요}.","明天借书给你。"]],"x":"V-아/어 주세요（请你帮我…）、V-(으)ㄹ게요（承诺）、V-(으)ㄹ까요?（提议）。","n":"① 主语一定是说话人“我”。\n② 对长辈不能用 줄게요，要用 드릴게요 / 드릴까요?（드리다 是 주다 的敬语）。\n③ 줄까요? 是“要我帮你…吗”，不是问对方打算做什么。"},"V-(으)세요":{"m":"“请…”，表示命令、请求；同时也是敬语现在时（您…）。","c":"对长辈或不熟的人使用，既可以是请求，也可以是描述对方的行为（敬语）。","r":"无收音 + 세요：가다 → 가세요\n有收音 + 으세요：앉다 → 앉으세요\nㄹ 收音：만들다 → 만드세요\n特殊敬语：먹다 → 드세요、자다 → 주무세요、있다 → 계세요","e":[["여기 {앉으세요}.","请坐这里。"],["안녕히 {가세요}.","请慢走。"],["어서 {드세요}.","请快吃。"]],"x":"V-지 마세요（请不要）、V-아/어 주세요、-(으)십시오（更正式）。","n":"① 只用于动词，不用于自己。\n② 疑问句 뭐 하세요? 是“您在做什么”（敬语现在时）。\n③ 먹다 → 드세요，자다 → 주무세요，要特别记。"},"V-지 마세요":{"m":"“请不要…”，表示禁止、劝阻。","c":"只用于动词；共动句是 -지 맙시다。","r":"动词词干 + 지 마세요（不分收음）：가다 → 가지 마세요、먹다 → 먹지 마세요\n共动：-지 맙시다\n更正式：-지 마십시오\n不要…而要…：-지 말고 -(으)세요","e":[["여기서 사진을 {찍지 마세요}.","请不要在这里拍照。"],["너무 {걱정하지 마세요}.","请不要太担心。"],["밤에 커피를 {마시지 마세요}.","晚上请不要喝咖啡。"]],"x":"V-(으)세요（请…）、안 V（不…）、V-지 않아도 되다（不必…）。","n":"① 只用于动词；形容词不能用。\n② 命令句不能用 안，要用 -지 마세요。\n③ -지 말고 -(으)세요：걱정하지 말고 쉬세요（别担心，休息吧）。"},"A/V-아/어야 되다/하다":{"m":"“必须…、得…”，表示义务。","c":"-아/어야 되다 和 -아/어야 하다 意思相同，되다 更口语。形容词也能用。","r":"最后元音 ㅏ/ㅗ → 아야：가다 → 가야 해요\n其他 → 어야：먹다 → 먹어야 해요\n하다 → 해야 해요\n过去：-아/어야 했어요\n名词：N이어야/여야 해요","e":[["내일 일찍 {일어나야 해요}.","明天必须早起。"],["약을 {먹어야 돼요}.","必须吃药。"],["한국어를 열심히 {공부해야 했어요}.","当时必须努力学韩语。"]],"x":"-(으)ㄹ 수밖에 없다（只能…）、-지 않아도 되다（不必…）、-(으)면 안 되다（不可以）。","n":"① 되다 和 하다 意思相同，-아/어야 되다 更口语。\n② “不必”要用 -지 않아도 되다，不是 -지 않아야 되다（后者是“必须不…”）。\n③ 不规则要先变形：듣다 → 들어야 해요。"},"A/V-아/어도 되다":{"m":"“可以…、…也行”，表示许可。","c":"-아/어도 = 即使…也；加上 되다 就表示“可以”。","r":"最后元音 ㅏ/ㅗ → 아도 되다：가다 → 가도 돼요\n其他 → 어도 되다：먹다 → 먹어도 돼요\n하다 → 해도 돼요\n问许可：-아/어도 돼요?\n回答：네, 돼요 / 아니요, 안 돼요","e":[["여기에 {앉아도 돼요}?","可以坐这里吗？"],["창문을 {열어도 돼요}?","可以开窗户吗？"],["내일 {와도 돼요}.","明天来也可以。"]],"x":"-(으)면 안 되다（不可以）、-아/어도（即使…也）、-지 않아도 되다（不必…）。","n":"① 这是许可，不是命令。\n② 拒绝用 -(으)면 안 되다：안 돼요。\n③ 对长辈问许可，更礼貌：-아/어도 될까요?"},"A/V-(으)면 안 되다":{"m":"“不可以…、不行”，表示禁止。","c":"多用于规则、礼仪或禁止的场合，比 -지 마세요 更偏向“规定”。","r":"无收音 + 면 안 되다：가다 → 가면 안 돼요\n有收音 + 으면 안 되다：먹다 → 먹으면 안 돼요\nㄹ 收音：놀다 → 놀면 안 돼요","e":[["여기서 담배를 {피우면 안 돼요}.","这里不可以吸烟。"],["도서관에서 {떠들면 안 돼요}.","在图书馆里不可以吵闹。"],["수업에 {늦으면 안 돼요}.","上课不可以迟到。"]],"x":"-지 마세요（请不要）、-아/어도 되다（可以）、-아/어야 되다（必须）。","n":"① 比 -지 마세요 更偏“规定、禁止”，不是直接劝阻。\n② 돼요 是 되어요 的缩写。\n③ 不规则要先变形：듣다 → 들으면 안 돼요。"},"A/V-지 않아도 되다 (안 A/V-아/어도 되다)":{"m":"“不必…、不…也可以”。","c":"表示没有必要做，不是“不能做”。","r":"词干 + 지 않아도 되다：가다 → 가지 않아도 돼요\n안 + A/V + 아/어도 되다：안 가도 돼요","e":[["오늘은 일찍 {오지 않아도 돼요}.","今天不用早来。"],["숙제는 {안 해도 돼요}.","作业可以不做。"],["비싸니까 {사지 않아도 돼요}.","很贵，不用买。"]],"x":"-아/어야 되다（必须）、-지 마세요（请不要）、-(으)ㄹ 필요가 없다（没必要）。","n":"① 意思是“没必要”，不是“不能”。\n② -지 않아도 되다 比 안 -아/어도 되다 更书面。\n③ 和 -아/어야 되다 正好相反：-아/어야 해요 ↔ -지 않아도 돼요。"},"A/V-(으)ㄹ 수밖에 없다":{"m":"“只能…、不得不…”，表示没有别的选择；也可表示“必然会…”。","c":"除了这个以外没有别的办法或结果，语气比较无奈或肯定。","r":"无收音 + ㄹ 수밖에 없다：가다 → 갈 수밖에 없다\n有收音 + 을 수밖에 없다：먹다 → 먹을 수밖에 없다\nㄹ 收音：살다 → 살 수밖에 없다\n名词：N일 수밖에 없다\n对过去的判断：-았/었을 수밖에 없다","e":[["비가 많이 와서 집에 {있을 수밖에 없어요}.","雨下得很大，只能待在家里。"],["시험이 내일이라서 {공부할 수밖에 없어요}.","明天考试，只能学习了。"],["그렇게 먹으면 살이 {찔 수밖에 없어요}.","那样吃的话必然会胖。"]],"x":"-아/어야 되다（必须）、-(으)ㄹ 수 없다（不能）、N 밖에（只有）。","n":"① 结构是 수（可能）+ 밖에 없다（没有…以外）：除此之外没有办法。\n② 也可表示必然的推断：살이 찔 수밖에 없어요。\n③ 想表达对过去的判断，要用 -았/었을 수밖에 없다。"},"V-(으)ㄹ 수 있다/없다":{"m":"“能…/不能…”，表示能力或可能性。","c":"① 有能力（수영할 수 있어요）；② 情况允许（오늘은 갈 수 있어요）；③ 有可能（비가 올 수 있어요）。","r":"无收音 + ㄹ 수 있다：가다 → 갈 수 있다\n有收音 + 을 수 있다：먹다 → 먹을 수 있다\nㄹ 收音：살다 → 살 수 있다\n否定：-(으)ㄹ 수 없다\n过去：-(으)ㄹ 수 있었다","e":[["저는 한국어를 {말할 수 있어요}.","我会说韩语。"],["오늘은 시간이 없어서 {갈 수 없어요}.","今天没有时间，去不了。"],["여기서 사진을 {찍을 수 있어요}?","这里可以拍照吗？"]],"x":"못 V（做不到）、-(으)ㄹ 줄 알다/모르다（会/不会）、-아/어도 되다（可以）。","n":"① 可以和 못 V 换用：갈 수 없어요 = 못 가요。\n② 也可表示可能性：내일 비가 올 수 있어요（明天可能下雨）。\n③ 不规则要先变形：듣다 → 들을 수 있어요。"},"V-(으)ㄹ 줄 알다/모르다":{"m":"“会/不会”，表示是否掌握某种技能或方法。","c":"强调“知不知道做的方法”，多用于通过学习掌握的技能。","r":"-(으)ㄹ 줄 알다：수영할 줄 알아요\n否定：-(으)ㄹ 줄 모르다：수영할 줄 몰라요\nㄹ 收音：만들다 → 만들 줄 알아요","e":[["저는 {운전할 줄 알아요}.","我会开车。"],["아직 김치를 {담글 줄 몰라요}.","我还不会腌泡菜。"],["한국 노래를 {부를 줄 알아요}?","你会唱韩国歌吗？"]],"x":"-(으)ㄹ 수 있다（能）、못 V、-(으)ㄴ/는/(으)ㄹ 줄 몰랐다（没想到）。","n":"① -(으)ㄹ 줄 알다 强调是否掌握方法，-(으)ㄹ 수 있다 还包括条件是否允许。\n② 줄 모르다 是“不会”；-(으)ㄴ 줄 몰랐다 则是“没想到”，意思不同。\n③ 回答：네, 할 줄 알아요 / 아니요, 할 줄 몰라요。"},"V-(으)러 가다/오다":{"m":"“为了做…而去/来”，说明去或来的目的。","c":"后面只能接 가다、오다、다니다 等移动动词。","r":"无收音 + 러：보다 → 보러\n有收音 + 으러：먹다 → 먹으러\nㄹ 收音：놀다 → 놀러 가다","e":[["친구를 {만나러} 갔어요.","去见朋友了。"],["점심을 {먹으러} 식당에 가요.","去餐厅吃午饭。"],["주말에 한강에 {놀러} 가요.","周末去汉江玩。"]],"x":"V-(으)려고（为了、打算）、N을/를 위해서（为了）、V-고 가다（…着去）。","n":"① 后面只能接 가다、오다、다니다 等移动动词。\n② 前面不加时态。\n③ 和 -(으)려고 不同，-(으)러 后面可以接命令、共动句：먹으러 갑시다。"},"V-(으)려고":{"m":"“为了…”，表示做某个动作的目的或打算。","c":"前一个动作是为了后面的动作，前后主语必须相同。","r":"无收音 + 려고：가다 → 가려고\n有收音 + 으려고：먹다 → 먹으려고\nㄹ 收音：살다 → 살려고","e":[["살을 {빼려고} 운동해요.","为了减肥在运动。"],["한국에 {가려고} 한국어를 배워요.","打算去韩国，所以学韩语。"],["선물을 {사려고} 백화점에 갔어요.","为了买礼物去了百货商店。"]],"x":"V-(으)러 가다/오다、V-기 위해서（为了）、V-(으)려고 하다（打算）。","n":"① 前后主语必须相同。\n② 后面不能接命令句、共动句（不说 먹으려고 가세요）。\n③ 前面不加时态，时态加在句末。"},"V-(으)려고 하다":{"m":"“打算…、想要…”；也可表示“正要…（即将）”。","c":"表达自己的打算，或某个动作正要发生。","r":"V-(으)려고 하다：가려고 해요、먹으려고 해요\n过去：-(으)려고 했어요（本来打算…）\n即将：지금 나가려고 해요（正要出门）","e":[["이번 방학에 한국에 {가려고 해요}.","这个假期打算去韩国。"],["지금 {나가려고 하는데} 같이 갈래요?","我正要出门，一起去吗？"],["어제 {운동하려고 했는데} 비가 왔어요.","昨天本打算运动的，结果下雨了。"]],"x":"V-(으)ㄹ 거예요（将来）、V-고 싶다（想）、V-기로 하다（决定）。","n":"① 主语一般是第一、二人称，说第三人称时语气更像转述。\n② -(으)려고 했다 表示“本来打算…但没做成”。\n③ 比 -(으)ㄹ 거예요 更偏“打算”，不那么确定。"},"N을/를 위해(서), V-기 위해(서)":{"m":"“为了…”，表示目的或为了某人、某事。","c":"名词用 을/를 위해(서)，动词用 -기 위해(서)，修饰名词时用 위한。","r":"N + 을/를 위해(서)：건강을 위해서\nV-기 위해(서)：살을 빼기 위해서\n定语：N을/를 위한 N：가족을 위한 선물","e":[["건강{을 위해서} 매일 운동해요.","为了健康每天运动。"],["한국어를 {배우기 위해서} 서울에 왔어요.","为了学韩语来了首尔。"],["부모님{을 위해} 선물을 샀어요.","为了父母买了礼物。"]],"x":"V-(으)려고（为了）、V-(으)러 가다/오다、N 때문에（因为）。","n":"① -기 위해서 前后主语必须相同。\n② 表示“目的”，和表示原因的 때문에 不同。\n③ 修饰名词时用 위한：가족을 위한 선물（为家人准备的礼物）。"},"V-기로 하다":{"m":"“决定…、约定…”。","c":"表示已经做出决定或和别人约好，多用过去式 -기로 했어요。","r":"动词词干 + 기로 하다：가다 → 가기로 해요\n已决定：-기로 했어요\n否定：-지 않기로 했어요（决定不…）","e":[["내일 친구를 {만나기로 했어요}.","约好明天见朋友。"],["올해부터 운동을 {하기로 했어요}.","决定今年开始运动。"],["담배를 {끊기로 했어요}.","决定戒烟了。"]],"x":"V-(으)려고 하다（打算）、V-(으)ㄹ 거예요（将来）、V-기로 약속하다（约定）。","n":"① 多用 -기로 했어요，表示“已经决定了”。\n② 比 -(으)려고 하다 更确定，是已经定下来的事。\n③ 想说“决定不…”用 -지 않기로 했어요。"},"A/V-고":{"m":"连接并列的内容（…而且…、…并且…）；也可表示动作的先后（…之后…）。","c":"把两个动作或状态连在一起，前后可以是同类的内容，也可以是先后顺序。","r":"词干 + 고（不分收音）：예쁘고 착해요、먹고 가요\n过去：-았/었고\n名词：N(이)고：학생이고","e":[["이 가방은 싸{고} 예뻐요.","这个包又便宜又漂亮。"],["밥을 먹{고} 커피를 마셨어요.","吃了饭，喝了咖啡。"],["저는 학생이{고} 동생은 회사원이에요.","我是学生，弟弟是上班族。"]],"x":"V-아/어서（联系紧密的先后）、V-고 나서（做完之后）、A/V-지만（转折）。","n":"① -고 前面通常不加时态，时态加在句末；也可以用 -았/었고。\n② 表示先后时，-고 只说顺序，-아/어서 前后联系更紧密。\n③ 前后主语可以不同。"},"V-거나":{"m":"“或者”，表示在几个选项中选择其一。","c":"连接两个或多个动词、形容词，表示做哪一个都可以。","r":"词干 + 거나（不分收音）：가다 → 가거나、읽다 → 읽거나\n前面不加时态","e":[["주말에 영화를 보{거나} 쇼핑을 해요.","周末看电影或者购物。"],["피곤하{거나} 아프면 쉬세요.","累了或者不舒服的话请休息。"],["커피를 마시{거나} 차를 마셔요.","喝咖啡或者喝茶。"]],"x":"N (이)나（名词的“或”）、V-든지（无论…）、V-(으)ㄴ/는지（是否）。","n":"① 只连接动词、形容词；连接名词用 (이)나。\n② 前面不能加时态。\n③ 表示选择之一，也可以只做其中一个。"},"A/V-지만":{"m":"“虽然…但是…”，表示转折。","c":"前后内容相反或形成对比，前后主语可以不同。","r":"词干 + 지만（不分收音）：맵다 → 맵지만\n过去：-았/었지만\n名词：N(이)지만：학생이지만","e":[["이 음식은 맵{지만} 맛있어요.","这个菜虽然辣，但很好吃。"],["한국어는 어렵{지만} 재미있어요.","韩语虽然难，但很有趣。"],["저는 학생{이지만} 아르바이트를 해요.","我虽然是学生，但在打工。"]],"x":"A/V-(으)ㄴ/는데（铺垫、转折）、A/V-아/어도（即使…也）、그렇지만（但是）。","n":"① 前后主语可以不同。\n② 和 -(으)ㄴ/는데 相比，-지만 的对比更明确。\n③ 接辅音词尾，不规则词干不变形：춥지만、어렵지만。"},"A/V-(으)ㄴ/는데":{"m":"表示背景铺垫、对比或委婉的转折，相当于“…，可是/…，所以…”。","c":"常见三种用法：① 先说明背景，再提问或请求；② 对比、转折；③ 委婉地陈述。","r":"形容词：无收音 + ㄴ데：예쁘다 → 예쁜데；有收音 + 은데：작다 → 작은데\n动词现在：-는데：가는데、먹는데\n过去：-았/었는데\n名词：N인데\nㄹ 收音：멀다 → 먼데、살다 → 사는데","e":[["지금 밖에 비가 {오는데} 우산 있어요?","外面正在下雨，你有伞吗？"],["이 옷은 {예쁜데} 너무 비싸요.","这件衣服漂亮是漂亮，但太贵了。"],["어제 영화를 {봤는데} 정말 재미있었어요.","昨天看了电影，非常有意思。"]],"x":"A/V-지만（转折）、A/V-(으)니까（理由）、A/V-(으)ㄴ/는데요（委婉）。","n":"① 动词现在用 -는데，过去用 -았/었는데，形容词用 -(으)ㄴ데。\n② 后面常接疑问、请求、命令。\n③ 说话时句尾可以直接结束，变成委婉的语气：-(으)ㄴ/는데요。"},"A/V-아/어서":{"m":"“因为…所以…”，表示原因、理由。","c":"前面是原因，后面是结果；常用于感谢、道歉：늦어서 죄송해요、도와 주셔서 감사합니다。","r":"最后元音 ㅏ/ㅗ → 아서：좋다 → 좋아서、바쁘다 → 바빠서\n其他 → 어서：먹다 → 먹어서、피곤하다 → 피곤해서\n名词：N(이)라서","e":[["너무 피곤{해서} 일찍 잤어요.","太累了，所以早早睡了。"],["길이 {막혀서} 늦었어요.","堵车所以迟到了。"],["학생{이라서} 할인을 받아요.","因为是学生，所以有折扣。"]],"x":"A/V-(으)니까（也表理由）、N 때문에、A/V-기 때문에。","n":"① 后面不能接命令句、共动句，这时要用 -(으)니까。\n② 前面不能加 았/었。\n③ 前后主语可以不同。"},"N 때문에, A/V-기 때문에":{"m":"“因为…”，表示原因；名词用 N 때문에，用言用 -기 때문에。","c":"强调原因本身，可用于负面或中性的原因；正面的原因常用 덕분에（多亏）。","r":"N + 때문에：비 때문에\nA/V-기 때문에：바쁘기 때문에\n过去：-았/었기 때문에\n名词：N(이)기 때문에","e":[["비 {때문에} 약속이 취소됐어요.","因为下雨，约会取消了。"],["일이 {많기 때문에} 쉴 수 없어요.","因为工作多，不能休息。"],["감기 {때문에} 학교에 못 갔어요.","因为感冒没能去学校。"]],"x":"A/V-아/어서、A/V-(으)니까、N 덕분에（多亏）。","n":"① -기 때문에 前面可以加 았/었。\n② 后面一般不接命令句、共动句。\n③ 回答“为什么”：왜 늦었어요? 길이 막혔기 때문이에요。"},"A/V-(으)면":{"m":"“如果…的话”；也可表示“每当…就…”。","c":"表示假设或条件，后句可以是陈述、命令、共动、请求。","r":"无收音 + 면：가다 → 가면\n有收音 + 으면：먹다 → 먹으면\nㄹ 收音：살다 → 살면\n过去（假设）：-았/었으면\n名词：N(이)면","e":[["내일 비가 {오면} 집에 있을 거예요.","明天要是下雨，我会待在家里。"],["시간이 {있으면} 같이 영화 봐요.","有时间的话一起看电影吧。"],["봄이 {되면} 꽃이 펴요.","春天一到花就开。"]],"x":"V-(으)려면（想要…的话）、A/V-아/어도（即使…也）、A/V-(으)니까（因为）。","n":"① 后句可以接命令、共动、请求。\n② 既表示假设，也表示“每当…就…”。\n③ 不规则要先变形：춥다 → 추우면、듣다 → 들으면。"},"V-(으)려면":{"m":"“想要…的话（就需要…）”。","c":"前面是想达到的目的，后面说必须做的事或建议。","r":"无收音 + 려면：가다 → 가려면\n有收音 + 으려면：먹다 → 먹으려면\nㄹ 收音：살다 → 살려면\n后面常接 -아/어야 하다、-(으)세요","e":[["한국어를 잘 {하려면} 매일 연습해야 해요.","想学好韩语，必须每天练习。"],["공항에 {가려면} 어떻게 해야 돼요?","想去机场的话该怎么走？"],["살을 {빼려면} 운동을 하세요.","想减肥的话，请运动。"]],"x":"A/V-(으)면（如果）、V-(으)려고 하다（打算）、V-아/어야 되다（必须）。","n":"① 前后主语必须相同。\n② 前面不加时态。\n③ 后面常接 -아/어야 하다、-(으)세요、-는 게 좋다。"},"A/V-아/어도":{"m":"“即使…也…”，表示让步。","c":"前面的情况不会影响后面的结果。","r":"最后元音 ㅏ/ㅗ → 아도：가다 → 가도\n其他 → 어도：먹다 → 먹어도、피곤하다 → 피곤해도\n名词：N(이)어도/여도","e":[["비가 {와도} 갈 거예요.","即使下雨也要去。"],["아무리 {바빠도} 밥은 먹어야 해요.","再忙也得吃饭。"],["이 옷은 {비싸도} 사고 싶어요.","这件衣服再贵也想买。"]],"x":"A/V-(으)면（如果）、A/V-지만（虽然）、-아/어도 되다（可以）。","n":"① 和 -아/어도 되다（许可）句型相关，意思不同。\n② 常配 아무리：아무리 바빠도。\n③ 后句可以是命令、提议：비가 와도 가세요。"},"V-아/어 보다":{"m":"表示“试着做做看”，也用来问对方有没有试过，或劝对方去试试。","c":"接在动词后，说话人想表达的是“做一下，看看结果怎么样”。常见的有 먹어 보다、입어 보다、가 보다、해 보다。-아/어 보세요 是“请试试”，-아/어 볼까요? 是“要不要试一下”，过去式 -아/어 봤어요 表示“已经试过”。","r":"动词词干最后的元音是 ㅏ/ㅗ → -아 보다：가다 → 가 보다　앉다 → 앉아 보다　오다 → 와 보다\n其他元音 → -어 보다：먹다 → 먹어 보다　입다 → 입어 보다　읽다 → 읽어 보다\n하다 → 해 보다：운동하다 → 운동해 보다\n보다 本身 → 봐 보다（看一看）\n不规则先变形再接：듣다 → 들어 보다　쓰다 → 써 보다　돕다 → 도와 보다","e":[["이 신발 한번 {신어 보세요}.","请试穿一下这双鞋。"],["한국에 가면 불고기를 꼭 {먹어 볼 거예요}.","去韩国的话，我一定要尝尝烤肉。"],["어제 새로 생긴 카페에 {가 봤는데} 분위기가 좋았어요.","昨天去了新开的咖啡厅，氛围很好。"]],"x":"-(으)ㄴ 적이 있다（有过…的经历）、-아/어 보이다（看起来…）、-아/어 보고 싶다（想试试）。","n":"① 只用于动词。形容词想说“看起来…”要用 -아/어 보이다，不是 -아/어 보다。\n② 常和 한번、꼭、직접 一起用，让“试一下”的语气更自然：한번 입어 보세요。\n③ 过去式 -아/어 봤어요 是“试过”，想强调“有这种人生经历”时，用 -(으)ㄴ 적이 있다 更合适。\n④ 要对长辈说“请您试试”，用 -아/어 보세요 就可以；要请对方“为我做”，则是 -아/어 주세요，不要混。\n⑤ 保留的是“试一下”的意思，不适合用在必须完成的事情上。"},"V-(으)ㄴ 적이 있다/없다":{"m":"表示“有过 / 没有过…的经历”，说的是人生中曾经发生过（或从未发生过）的事。","c":"적 的意思是“经历、次数”。V-(으)ㄴ 적이 있다 说“有过”，V-(으)ㄴ 적이 없다 说“没有过”。常配 한 번、여러 번、아직、한 번도。问句：-(으)ㄴ 적이 있어요?，回答：네, 있어요 / 아니요, 없어요。","r":"无收音 → ㄴ 적이 있다：가다 → 간 적이 있다　보다 → 본 적이 있다\n有收音 → 은 적이 있다：먹다 → 먹은 적이 있다　읽다 → 읽은 적이 있다\nㄹ 收音脱落：살다 → 산 적이 있다　만들다 → 만든 적이 있다\n不规则先变形：듣다 → 들은 적이 있다　돕다 → 도운 적이 있다\n否定：-(으)ㄴ 적이 없다　强调：한 번도 -(으)ㄴ 적이 없다\n常和 -아/어 보다 搭配：먹어 본 적이 있다（吃过）","e":[["저는 아직 비행기를 {타 본 적이 없어요}.","我还没坐过飞机。"],["한국 드라마를 보다가 눈물을 {흘린 적이 있어요}.","看韩剧时我哭过。"],["혹시 이 노래를 {들은 적이 있어요}?","你有没有听过这首歌？"]],"x":"-아/어 보다（试着做）、-았/었었어요（过去完成）、-(으)ㄹ 때가 있다（有时会…）、-(으)ㄴ 지（自从…）。","n":"① 前面要用过去冠词形 -(으)ㄴ，不能用 -는 或 -(으)ㄹ。\n② 说“有时候会这样”不是这个语法，要用 -(으)ㄹ 때가 있다 或 -기도 하다。\n③ 这是人生经历，不适合用于“昨天”“刚才”这类很近的单次动作，那要用 -았/었어요：不说 어제 영화를 본 적이 있어요。\n④ 想强调“以前有，现在没有了”，可以说 -(으)ㄴ 적이 있었어요。\n⑤ ㄹ 收音词干要脱落：산 적이、만든 적이，不是 살은 적이。"},"V-고 있다":{"m":"除了“正在做”，还表示“穿着、戴着”，以及“最近一直在做（持续一段时间）”。","c":"在这一条里要特别记两个用法：① 穿戴类动词（입다、신다、쓰다、끼다、매다、메다）+ -고 있다 = 穿着、戴着，常用来描述外貌；② 说“最近在学…、在住…”这种持续一段时间的行为，不一定是此刻正在做。","r":"动词词干 + 고 있다（不分收音）\n穿戴：입다 → 입고 있다　신다 → 신고 있다　쓰다 → 쓰고 있다　끼다 → 끼고 있다\n持续：배우다 → 배우고 있다　살다 → 살고 있다\n过去：-고 있었어요　否定：-고 있지 않아요\n敬语：-고 계세요（먹다 → 드시고 계세요）","e":[["저 빨간 모자를 {쓰고 있는} 사람이 제 동생이에요.","那个戴红帽子的人是我弟弟。"],["요즘 저는 매일 아침 수영을 {배우고 있어요}.","最近我每天早上都在学游泳。"],["할아버지께서는 지금 신문을 {보고 계세요}.","爷爷现在正在看报纸。"]],"x":"-아/어 있다（结果状态的持续）、-는 중이다（正在…）、-고 계시다（敬语）。","n":"① 他动词用 -고 있다，自动词（앉다、서다、눕다、열리다）要用 -아/어 있다：앉아 있다（坐着），不说 앉고 있다。\n② 입다 是“穿上”这个动作，입고 있다 才是“穿着”的状态；说“正在穿衣服”也可以用它，要看语境。\n③ 形容词一般不用 -고 있다。\n④ 살다 的“住”也用 -고 있다：서울에 살고 있어요。\n⑤ 对长辈要换成 -고 계시다，不要说 하고 있으세요。"},"V-아/어 있다":{"m":"表示某个动作完成之后，它的结果状态一直持续着（…着）。","c":"描述“现在的样子”，而不是动作的过程。多用于自动词和被动词：앉다、서다、눕다、열리다、닫히다、켜지다、꺼지다、걸리다、붙다、남다、가다、오다。","r":"最后元音是 ㅏ/ㅗ → -아 있다：앉다 → 앉아 있다　가다 → 가 있다　오다 → 와 있다\n其他元音 → -어 있다：서다 → 서 있다　남다 → 남아 있다（ㅏ → 아）\n被动词：열리다 → 열려 있다　켜지다 → 켜져 있다　걸리다 → 걸려 있다\n不规则先变形：눕다 → 누워 있다\n过去：-아/어 있었어요","e":[["교실 문이 {열려 있어요}.","教室的门开着。"],["아이가 소파에 {누워 있어요}.","孩子躺在沙发上。"],["벽에 큰 그림이 {걸려 있어요}.","墙上挂着一幅大画。"]],"x":"-고 있다（动作进行中）、-아/어 놓다、-아/어 두다（为了以后而先做好）。","n":"① 只能接自动词、被动词，不能接他动词：문을 열어 있어요（×）→ 문이 열려 있어요（✓）。\n② 和 -고 있다 的区别：앉아 있다 = 坐着（结果状态），앉고 있다 一般不用；他动词 입다、쓰다 用 입고 있다、쓰고 있다。\n③ 前面的主语用 이/가：불이 켜져 있어요。\n④ 对长辈用 -아/어 계시다：앉아 계세요。\n⑤ 눕다、돕다 这类词要先做 ㅂ 不规则变化。"},"A-아/어지다":{"m":"接形容词，表示“变得…”，说的是状态随着时间慢慢变化；接动词时表示被动（被…、自然成为…）。","c":"主要用来描述变化：날씨가 따뜻해지다（天气变暖）、몸이 건강해지다（身体变健康）。强调“从一种状态变成另一种状态”。动词 + -아/어지다 则是被动用法，如 만들어지다（被做成）、알려지다（被人所知）。","r":"最后元音 ㅏ/ㅗ → -아지다：좋다 → 좋아지다　많다 → 많아지다　작다 → 작아지다\n其他元音 → -어지다：길다 → 길어지다　어렵다 → 어려워지다\n하다 → 해지다：건강하다 → 건강해지다　조용하다 → 조용해지다\n不规则先变形：춥다 → 추워지다　예쁘다 → 예뻐지다　빠르다 → 빨라지다　다르다 → 달라지다　하얗다 → 하얘지다","e":[["봄이 되니까 날씨가 {따뜻해졌어요}.","到了春天，天气变暖了。"],["운동을 시작한 후에 몸이 {건강해졌어요}.","开始运动后，身体变健康了。"],["저녁이 되자 거리가 {조용해졌어요}.","一到傍晚，街道就安静下来了。"]],"x":"V-게 되다（变得…，用于动词）、A-게 하다/만들다（使…）、-아/어지다（动词被动）。","n":"① 形容词想说“变得…”用 -아/어지다，动词想说“变得…”用 -게 되다：날씨가 추워졌어요，한국어를 좋아하게 됐어요。\n② 说“更…了”时常加 더：더 좋아졌어요、더 어려워졌어요。\n③ 过去式 -아/어졌어요 表示“已经变了”，现在时 -아/어져요 表示“会渐渐变…”。\n④ 不要和 A-게 되다 混：예쁘게 되다 不太自然，应该说 예뻐지다。\n⑤ 动词 + -아/어지다 是被动，意思完全不同：이 노래는 유명해졌어요（变得有名）、집이 지어졌어요（房子被盖好了）。"},"V-게 되다":{"m":"表示“变得、变成、（自然而然地）会…”，强调结果是由外在原因、环境或情势造成的，而不是本人刻意决定的。","c":"常见三种场合：① 因缘巧合的结果：알게 되다（得知）、만나게 되다（遇到）；② 慢慢形成的变化：좋아하게 되다；③ 被安排的结果：이사 가게 되다、결혼하게 되다（有礼貌地宣布）。","r":"动词词干 + 게 되다（不分收音）：알다 → 알게 되다　가다 → 가게 되다　좋아하다 → 좋아하게 되다　하다 → 하게 되다\n过去：-게 됐어요（最常见，表示结果已经形成）\n将来：-게 될 거예요\n否定：-지 않게 되다 / 못 하게 되다\n能力的变化：-(으)ㄹ 수 있게 되다","e":[["회사 일 때문에 다음 달에 부산으로 {이사하게 됐어요}.","因为公司的事，下个月要搬去釜山了。"],["한국 음식을 자주 먹다 보니 매운 음식도 {좋아하게 됐어요}.","常吃韩国菜，不知不觉也喜欢上辣的了。"],["저는 대학교에서 지금의 남편을 {만나게 됐어요}.","我是在大学里遇到现在的丈夫的。"]],"x":"V-기로 하다（自己决定）、A-아/어지다（形容词变化）、-(으)ㄹ 수 있게 되다（变得能够…）。","n":"① 和 -기로 하다 的区别：-기로 하다 是自己下的决定，-게 되다 是情势使然，不是我定的。\n② 说“变得会做某事”常用 -(으)ㄹ 수 있게 되다：수영할 수 있게 됐어요。\n③ 想委婉地宣布结果，用 -게 됐어요 会比直说更客气：결혼하게 됐습니다。\n④ 形容词的变化更常用 -아/어지다：날씨가 따뜻해졌어요。\n⑤ 想说“终于做到了”这类结果，常搭配 드디어、결국。"},"A/V-겠어요":{"m":"根据眼前看到、听到的情况，当场做出“看来会…”“想必…”的判断；也常用来表达对别人处境的体会。","c":"说话人对眼前的线索进行即时推断，语气比 -(으)ㄹ 거예요 更“有依据、当场得出”。表示体会时，常见于 맛있겠어요（看起来好吃）、힘들겠어요（一定很辛苦）。","r":"动词/形容词词干直接 + 겠어요，不分有没有收音：가다 → 가겠어요、먹다 → 먹겠어요、예쁘다 → 예쁘겠어요\n过去的推测：词干 + 았/었겠어요：어제 많이 힘들었겠어요\n名词：N(이)겠어요 → 학생이겠어요\n不规则变化不影响 겠 前面：덥다 → 덥겠어요、듣다 → 듣겠어요","e":[["하늘이 이렇게 어두우니까 곧 비가 {오겠어요}.","天色这么暗，看来马上要下雨了。"],["이렇게 매일 연습했으니 시험에 {합격하겠어요}.","每天都这样练习，想必能通过考试。"],["어제 밤을 새웠다면 오늘 많이 {피곤하겠어요}.","如果昨天熬了夜，今天一定很累吧。"]],"x":"-(으)ㄹ 거예요（比较平稳的预测）、-(으)ㄹ 것 같다（委婉的推测）、-겠어요?（询问意向，见“意志与计划”）、-(으)ㄹ까요?（自问/询问推测）。","n":"① 第一人称说 -겠어요 常变成“我来做/我愿意”的意志（例：제가 하겠어요），要看语境。\n② 알겠어요、모르겠어요 是固定说法，意思是“知道了／不明白”，不是推测。\n③ 说自己亲身经历的事实不能用推测：不说 저는 어제 바빴겠어요。\n④ 对长辈的处境表示体会时，可以说 힘드셨겠어요，把 시 放在 겠 前面。"},"V-(으)ㄹ 거예요":{"m":"表示“应该会…”“大概是…”的推测，说话人根据常识、经验对别人或情况作判断。","c":"这里重点是推测用法（主语多为第三人称、天气、事物）。和“将来时态”里表示计划的用法形式完全相同，靠主语和语境区分：我 → 打算；他/天气 → 应该会。","r":"无收音 + ㄹ 거예요：오다 → 올 거예요\n有收音 + 을 거예요：먹다 → 먹을 거예요\nㄹ 收音直接 + 거예요：살다 → 살 거예요\n形容词同样可用：많다 → 많을 거예요、바쁘다 → 바쁠 거예요\n过去的推测：-았/었을 거예요 → 벌써 도착했을 거예요\n名词：N일 거예요 / N(이)ㄹ 거예요 → 학생일 거예요","e":[["지금쯤 동생은 벌써 학교에 {도착했을 거예요}.","这个时候弟弟应该已经到学校了。"],["그 식당은 주말에는 사람이 {많을 거예요}.","那家餐厅周末人应该会很多。"],["민수 씨라면 약속을 잊지 않고 꼭 {올 거예요}.","如果是敏秀的话，不会忘记约定，一定会来的。"]],"x":"-겠어요（当场依据线索的判断）、-(으)ㄹ 것 같다（语气更委婉、更主观）、-(으)ㄹ까요?（用疑问表示不确定）、将来时态 -(으)ㄹ 거예요（计划）。","n":"① 想表示“我觉得”这种主观感受时，用 -(으)ㄹ 것 같다 更自然。\n② 已经确定的事实不能用推测，例如不说 오늘은 월요일일 거예요（如果你确实不知道日期才可以）。\n③ 常和 아마（大概）、분명히（一定）、틀림없이（肯定）一起出现，加强推测的程度。\n④ 书写时要和后面的名词 거（东西）区分：-(으)ㄹ 거예요 的 거 是依存名词，前面必须有 -(으)ㄹ。"},"A/V-(으)ㄹ까요?":{"m":"表示对不确定的事情的疑问或自问：“会…吗？”“是不是…呢？”，带有担心、好奇或期待。","c":"主语是第三人称、天气、事物时，是在推测未知的事；也可以当作问对方“你觉得会…吗”。回答常用 -(으)ㄹ 거예요 或 -(으)ㄹ 것 같아요。","r":"无收音或 ㄹ 收音 + ㄹ까요?：오다 → 올까요?、만들다 → 만들까요?\n有收音 + 을까요?：먹다 → 먹을까요?、많다 → 많을까요?\n形容词也可以：맛있다 → 맛있을까요?、어렵다 → 어려울까요?\n过去：-았/었을까요? → 벌써 갔을까요?\n不规则：듣다 → 들을까요?、돕다 → 도울까요?","e":[["내일은 날씨가 {좋을까요}?","明天天气会好吗？"],["이 시간에 민수 씨가 집에 {있을까요}?","这个时间敏秀会在家吗？"],["제가 보낸 메시지를 벌써 {읽었을까요}?","我发的消息，他已经看了吗？"]],"x":"V-(으)ㄹ까요?（我们…好吗？提议，见“询问意见与提出建议”）、-(으)ㄹ 거예요（推测的回答）、-(으)ㄹ 것 같다（委婉的推测）。","n":"① 主语是“我们/我”并配合动词时，多半是提议，而不是推测：우리 같이 갈까요? 是“一起去吧？”。\n② 主语是第三人称、事物或天气时才是推测。\n③ 常用于自言自语，例：이 길이 맞을까?（这条路对不对呢？）。\n④ 不要对长辈直接问 “…을까요?” 来要求对方判断，需要时改用 -(으)실까요?。"},"A/V-(으)ㄴ/는/(으)ㄹ 것 같다":{"m":"表示“好像…”“我觉得…”，对现在、过去或将来的事情作委婉的推测或表达个人感觉。","c":"根据看到、听到、感觉到的情况来推断，语气比较柔和，也常用来避免把话说得太绝对。","r":"现在：动词 + 는 것 같다（가다 → 가는 것 같다）；形容词 + (으)ㄴ 것 같다（크다 → 큰 것 같다、좋다 → 좋은 것 같다）；있다/없다 → 있는/없는 것 같다\n过去：动词 + (으)ㄴ 것 같다（가다 → 간 것 같다）；形容词 + 았/었던 것 같다（좋았던 것 같다）；也可用 -았/었는 것 같다\n将来/推测：动词、形容词 + (으)ㄹ 것 같다（갈 것 같다、좋을 것 같다）\nㄹ 收音：살다 → 사는/산/살 것 같다；形容词 길다 → 긴 것 같다\n名词：N인 것 같다 → 학생인 것 같다\n不规则：춥다 → 추운 것 같다、듣다 → 듣는/들은/들을 것 같다","e":[["밖에 비가 {오는 것 같아요}.","外面好像在下雨。"],["이 옷이 저한테는 조금 {큰 것 같아요}.","这件衣服对我来说好像有点大。"],["내일은 눈이 {올 것 같아요}.","明天好像会下雪。"]],"x":"-(으)ㄹ 거예요（更肯定的预测）、-겠어요（当场依据线索的判断）、-(으)ㄴ/는 모양이다（根据迹象判断）、-(으)ㄴ/는지 모르겠다（不太确定）。","n":"① 说自己的感觉也可以用，让语气更委婉：배가 고픈 것 같아요、제 생각에는 이게 더 좋은 것 같아요。\n② 前面接动词时，时态要分清：는（现在）、(으)ㄴ（过去）、(으)ㄹ（将来）。形容词现在用 (으)ㄴ，不是 는。\n③ 已经确定的事实不能用，例如不说 저는 학생인 것 같아요（除非你真的不确定）。\n④ 口语里常缩写为 -ㄴ/는/ㄹ 것 같아요 → -ㄴ/는/ㄹ 거 같아요。"},"V-(으)ㄹ래요?":{"m":"询问对方想不想做某事，或说出自己“我想/我要…”的意愿；语气随意、亲近。","c":"问句：“你要不要…？”问听话人的意愿或邀请对方；陈述句：“我要…”只能用于第一人称，表达临时做出的决定或想要的东西。","r":"无收音或 ㄹ 收音 + ㄹ래요：가다 → 갈래요、만들다 → 만들래요\n有收音 + 을래요：먹다 → 먹을래요、읽다 → 읽을래요\n否定：안 + 动词 + ㄹ래요，或 -지 않을래요?（这样问带有“要不要…”的邀请语气）\n不规则：듣다 → 들을래요、돕다 → 도울래요","e":[["커피 한 잔 {마실래요}?","要不要喝杯咖啡？"],["저는 오늘 집에서 영화를 {볼래요}.","我今天想在家看电影。"],["시간 있으면 같이 점심 {먹을래요}?","有时间的话，要不要一起吃午饭？"]],"x":"-(으)ㄹ까요?（和对方商量、提议）、-겠어요?（更有礼貌地问意向）、-(으)시겠어요?（对长辈、客人）、-고 싶다（想要，不限第一人称问句）。","n":"① 这个语法在“意志与计划”和“询问意见与提出建议”两类都出现：前者重在表达“我要”，后者重在邀请“你要不要”。\n② 陈述句只能是第一人称，不能说 그는 갈래요。\n③ 比较随意，对长辈、客人要换成 -(으)시겠어요? 或 -(으)실래요?。\n④ 形容词不能用，只用在动词后面。\n⑤ 语气有时显得任性或强硬，特别是否定句：안 갈래요（我就是不去）。"},"A/V-겠어요?":{"m":"礼貌地询问对方的意向或打算：“您要…吗？”；也可以用反问的语气表示“怎么可能…？”。","c":"疑问句里的 -겠- 是问听话人的意志，所以主语通常是“你”。语气比 -(으)ㄹ래요? 更正式、更有礼貌，常见于服务场合。","r":"动词词干直接 + 겠어요?，不看收音：가다 → 가겠어요?、먹다 → 먹겠어요?\n对长辈或客人：-(으)시겠어요?\n反问：形容词、动词都可：어떻게 믿겠어요? → 怎么能相信呢？\n否定：안 + V + 겠어요? / V-지 않겠어요?","e":[["저는 비빔밥을 먹을 건데 민수 씨는 뭘 {먹겠어요}?","我要吃拌饭，敏秀你要吃什么呢？"],["이번 주말 모임에 {참석하겠어요}?","这个周末的聚会你要参加吗？"],["이런 날씨에 어떻게 밖에서 {운동하겠어요}?","这种天气怎么可能在外面运动呢？"]],"x":"-(으)ㄹ래요?（更随意的问法）、-(으)시겠어요?（敬语）、-(으)ㄹ까요?（商量提议）、-겠어요（推测或意志的陈述）。","n":"① 问别人的意向时，主语是“你”；问“我”的意向没有意义，所以不说 제가 가겠어요? 当问句。\n② 反问用法要靠语气和上下文，例：내가 그걸 어떻게 알겠어요?（我怎么会知道？）。\n③ 对长辈最好说 -(으)시겠어요?，直接用 -겠어요? 稍显生硬。\n④ 和“推测”里的 -겠어요 同形，疑问句里更偏向意志或反问。"},"V-(으)ㄹ게요?":{"m":"说话人向对方承诺或表明“我来做…”，通常是在回应对方的话或情境；句尾上扬时变成“那我…可以吗？”的征求。","c":"表示当场决定要做某事，并且让对方知道，带有“我答应你/我先…”的意味。带问号的用法是用上扬的语调征求对方同意。","r":"无收音或 ㄹ 收音 + ㄹ게요：가다 → 갈게요、만들다 → 만들게요\n有收音 + 을게요：먹다 → 먹을게요、읽다 → 읽을게요\n不规则：듣다 → 들을게요、돕다 → 도울게요\n只和动词搭配，主语限第一人称","e":[["걱정하지 마세요. 내일은 일찍 {올게요}.","别担心，我明天会早点来。"],["짐이 무거워 보이는데 제가 {들게요}?","行李看起来很重，我来拿，可以吗？"],["그럼 저는 먼저 {갈게요}. 내일 봐요.","那我先走了，明天见。"]],"x":"-(으)ㄹ래요（我想要/要不要）、-(으)ㄹ 거예요（计划，不一定对谁承诺）、-(으)ㄹ까요?（提议“我来…好吗”）、-겠어요（决心）。","n":"① 只能用第一人称，只能接动词，不能用形容词。\n② 重点是“对听话人的承诺或告知”，所以自己独自的计划不说 -(으)ㄹ게요，而说 -(으)ㄹ 거예요。\n③ 不能直接用在疑问句里问别人：不说 너는 갈게요?。带问号只用于“我…可以吗？”的征求。\n④ 正式场合（书面、报告）较少用，多说 -겠습니다。"},"V-(으)ㄹ까요?":{"m":"提议“我们…好吗？”，或主动提出“要不要我来…？”，询问对方的意见。","c":"主语是“우리（我们）”时是邀请；主语是“제가（我）”时是询问对方“要不要我做…”。答复常用 -아/어요、-(으)ㅂ시다、좋아요。","r":"无收音或 ㄹ 收音 + ㄹ까요?：가다 → 갈까요?、만들다 → 만들까요?\n有收音 + 을까요?：먹다 → 먹을까요?、앉다 → 앉을까요?\n不规则：듣다 → 들을까요?、돕다 → 도울까요?\n只接动词","e":[["우리 같이 영화 {볼까요}?","我们一起去看电影好吗？"],["너무 더운데 제가 창문을 {열까요}?","太热了，要不要我把窗户打开？"],["점심에 뭘 {먹을까요}?","午饭吃什么好呢？"]],"x":"-(으)ㅂ시다（强烈提议、较正式）、-(으)ㄹ래요?（问对方意愿）、-(으)시겠어요?（对长辈）、A/V-(으)ㄹ까요?（推测，见“推测”）。","n":"① 与“推测”里的 -(으)ㄹ까요? 形式相同，区别是：主语为 우리/제가 并接动词 → 提议；主语为他人或事物 → 推测。\n② 想表示“要不要我帮你…”时，对长辈用 제가 -아/어 드릴까요?。\n③ 对方回答时，不说 -(으)ㄹ까요，而说 좋아요、그래요、-아/어요。\n④ 询问意见的口吻比 -(으)ㅂ시다 柔和很多，日常邀请首选 -(으)ㄹ까요?。"},"V-(으)ㅂ시다?":{"m":"提议“让我们…吧”，较正式、带有号召意味；原形 -(으)ㅂ시다 是共同行动的邀请，加上升语调时变成征求“我们…吧？”。","c":"说话人邀请对方一起做某事，自己也包括在内，口气比 -아/어요 更正式、更果断，常出现在会议、同辈、对下属的场合。","r":"无收音 + ㅂ시다：가다 → 갑시다、하다 → 합시다\n有收音 + 읍시다：먹다 → 먹읍시다、앉다 → 앉읍시다\nㄹ 收音要脱落 ㄹ：만들다 → 만듭시다、놀다 → 놉시다\n不规则：듣다 → 들읍시다、돕다 → 도웁시다\n否定：-지 맙시다（不要…吧）","e":[["시간이 됐으니까 회의를 {시작합시다}.","时间到了，我们开始开会吧。"],["이번 주말에는 모두 함께 {만납시다}?","这个周末我们大家一起见个面，好吗？"],["날씨도 좋은데 점심은 밖에서 {먹읍시다}.","天气也好，午饭我们到外面吃吧。"]],"x":"-(으)ㄹ까요?（柔和的提议）、-아/어요（口语里常用的邀请）、-자（对朋友、平语）、-(으)시죠（对长辈委婉的提议）。","n":"① 对长辈、上司使用会失礼，应改用 -(으)시죠 或 -(으)실래요?。\n② 只接动词，形容词不能用。\n③ 否定的提议用 -지 맙시다，不用 안。\n④ 带问号的用法比较少见，多是在会议中征求同意，通常用 -(으)ㄹ까요? 更自然。"},"V-(으)시겠어요?":{"m":"礼貌地询问对方的意向或提出建议：“您要…吗？”“要不要…？”；加上 -아/어 주시겠어요? 就是礼貌的请求。","c":"在 -겠어요? 前加上敬语 -(으)시，表示对对方尊敬。常见于餐厅、商店、办公室等服务或对长辈、客人的场合。","r":"无收音或 ㄹ 收音：去掉 ㄹ 后 + 시겠어요?：가다 → 가시겠어요?、만들다 → 만드시겠어요?、살다 → 사시겠어요?\n有收音 + 으시겠어요?：읽다 → 읽으시겠어요?、앉다 → 앉으시겠어요?\n特殊敬语：먹다/마시다 → 드시겠어요?、자다 → 주무시겠어요?、있다 → 계시겠어요?\n请求：-아/어 주시겠어요? → 도와 주시겠어요?","e":[["커피 한 잔 {드시겠어요}?","您要来杯咖啡吗？"],["이쪽에 {앉으시겠어요}?","您要坐这边吗？"],["죄송하지만 잠깐만 {기다려 주시겠어요}?","不好意思，能请您稍等一下吗？"]],"x":"-(으)ㄹ래요?（对平辈、亲近的人）、-겠어요?（不加敬语的问法）、-(으)실래요?（比较柔和的敬语问法）、-아/어 주세요（请求）。","n":"① 说“我”的行为时不能加 -(으)시，所以不说 제가 가시겠어요?。\n② 请求用法的 -아/어 주시겠어요? 比 -아/어 주세요 更客气。\n③ 和长辈说话时，主语如果是长辈，必须用 -(으)시；如果问的是第三者，也要看关系。\n④ 注意特殊敬语词汇，不要写成 먹으시겠어요?，应是 드시겠어요?。"},"A/V-(으)ㄴ/는지":{"m":"把疑问句放进句子里，表示“是否…、…是不是”，常配 알다、모르다、궁금하다 等词，是间接疑问的说法。","c":"前面可以带疑问词（누가、뭐、언제、어디、왜、얼마나）：어디에 가는지 알아요?（你知道去哪里吗？）；没有疑问词时表示“是不是”，常写成“…는지 안 …는지”：비가 오는지 안 오는지。后面常接 알다、모르다、궁금하다、기억나다、묻다、확인하다。","r":"动词现在：-는지　먹다 → 먹는지　가다 → 가는지　살다 → 사는지（ㄹ 脱落）\n形容词现在：-(으)ㄴ지　예쁘다 → 예쁜지　좋다 → 좋은지　멀다 → 먼지（ㄹ 脱落）\n名词：N인지　학생이다 → 학생인지\n过去：-았/었는지　갔는지　맛있었는지\n推测/将来：-(으)ㄹ지　올지　갈지\n있다/없다 按动词处理：있는지、없는지\n不规则：춥다 → 추운지　그렇다 → 그런지　듣다 → 듣는지","e":[["오늘 모임이 몇 시에 {시작하는지} 아세요?","您知道今天的聚会几点开始吗？"],["어제 어디에서 {잃어버렸는지} 기억이 안 나요.","我想不起来昨天是在哪里弄丢的。"],["이 가방이 {비싼지} 안 비싼지 가게에 가서 확인해 볼게요.","这个包贵不贵，我去店里确认一下。"]],"x":"-(으)ㄹ지 모르겠다（不知道会不会…）、-(으)ㄴ/는데（背景）、-나요?/-(으)ㄴ가요?（直接询问）。","n":"① 它不是直接问句，而是嵌在大句子里的疑问：不能单独当提问用，要说 오늘 모임이 몇 시에 시작해요?。\n② 看动作发生的时间选形式：现在 -는지/-(으)ㄴ지，过去 -았/었는지，还没发生用 -(으)ㄹ지。\n③ 名词要加 인：학생인지（不是 학생지）。\n④ 不要和 -는 데（名词化，“在…方面”）、-(으)ㄴ/는데（背景铺垫）混：这里是说“是否”。\n⑤ 前面是疑问词时，不是“你知道吗”的是非问，而是“你知道（具体是什么）吗”。"},"V-는 데 걸리다/들다":{"m":"表示“做某事需要（花）多少时间、钱、力气”。","c":"-는 데 里的 데 是“…的事情、…这件事上”的意思。时间用 걸리다，钱和力气、功夫用 들다。常见问句：V-는 데 얼마나 걸려요? / V-는 데 얼마나 들어요?。从某地到某地要多久，也可以直接说 N에서 N까지 걸리다。","r":"动词词干 + 는 데（不分收音，데 前要空格）\n먹다 → 먹는 데　가다 → 가는 데　쓰다 → 쓰는 데\nㄹ 收音脱落 ㄹ：만들다 → 만드는 데　살다 → 사는 데\n后面：시간 → 걸리다（걸려요、걸렸어요、걸릴 거예요）\n　　　돈、힘、노력 → 들다（들어요、들었어요）\n时间的量放在后面：한 시간 걸리다、이틀이 걸리다","e":[["집에서 회사까지 {가는 데} 한 시간쯤 걸려요.","从家到公司大约要一个小时。"],["새 휴대폰을 {사는 데} 돈이 많이 들었어요.","买新手机花了很多钱。"],["혼자 이사를 {하는 데} 힘이 많이 들었어요.","一个人搬家很费力气。"]],"x":"-(으)ㄴ/는데（背景）、N에서 N까지 걸리다、-는 동안（…期间）。","n":"① 걸리다 只用于时间，들다 用于钱、力气、功夫；不要说 돈이 걸려요。\n② -는 데 要分开写（데 是依存名词），和 -는데（背景）写法、意思都不同。\n③ 这个句型只接动词，形容词不这样用。\n④ 问时间用 얼마나 걸려요?，问费用用 얼마나 들어요?。\n⑤ 动词要用现在形 -는，不管事情是否已经发生：시험을 준비하는 데 한 달 걸렸어요（过去的事也一样）。"},"A/V-지요?":{"m":"表示“…吧？／…对吧？”，用来确认自己已经知道或猜到的事；语调往下降时，也可以表示“当然啊”。","c":"说话人已经有把握，只是想请对方确认或征求同意。语调上扬是确认，语调下降是强调“这是理所当然的”。口语里常缩写成 -죠。用 -(으)시지요 还可以有礼貌地提议“请…吧”。","r":"动词、形容词词干 + 지요（不分收音）：좋다 → 좋지요　가다 → 가지요　먹다 → 먹지요\n过去：-았/었지요　봤지요　했지요\n将来：-(으)ㄹ 거지요　갈 거지요\n名词：N이지요（有收音）/ N지요（无收音，口语多说 N죠）：학생이지요　가수죠\n敬语：-(으)시지요　오시지요\n缩写：-지요 → -죠　좋죠　맞죠","e":[["오늘 날씨가 정말 {좋지요}?","今天天气真好，对吧？"],["어제 그 영화 {봤지요}?","昨天那部电影你看了吧？"],["여기가 서울역{이지요}?","这里是首尔站，对吗？"]],"x":"-(으)ㄴ가요?/-나요?（单纯询问）、-잖아요（提醒对方本来知道的事）、-(으)ㄹ까요?（提议）。","n":"① 用在“我已经知道，只是想确认”时；真的不知道、想直接问，要用 -아/어요? 或 -나요?/-(으)ㄴ가요?。\n② 语调决定意思：↗ 是确认，↘ 是强调“当然”：A：좋아요? B：그럼요, 좋지요.\n③ -지요 比 -잖아요 柔和：-잖아요 带有“你不是知道吗”的责备语气。\n④ 口语多说 -죠，书面或正式场合用 -지요。\n⑤ 用于长辈时要加敬语 -(으)시지요?，例如 선생님도 오시지요?。"},"A/V-네요":{"m":"表示对当场亲眼看到、亲耳听到、亲身体验到的事实，发出“原来…啊／…呢”的感叹。","c":"表示说话人刚刚才发现某件事，带着一点惊讶或赞叹。口语里非常常用，既能感叹，也能委婉地称赞或评价对方，如 멋있네요、잘하시네요。接过去时 -았/었네요 时，表示“发现已经…了”。","r":"动词、形容词词干 + 네요（不分收音）：맛있다 → 맛있네요　오다 → 오네요　좋다 → 좋네요\n过去：-았/었네요　왔네요　됐네요\n名词：N이네요 / N네요：학생이네요　가수네요\nㄹ 收音脱落：살다 → 사네요　만들다 → 만드네요\n不规则词干不变形：춥다 → 춥네요　덥다 → 덥네요","e":[["우와, 이 케이크 정말 {맛있네요}!","哇，这个蛋糕真好吃啊！"],["밖에 눈이 {오네요}. 외출할 때 조심하세요.","外面下雪了呢，出门时请小心。"],["벌써 열두 시가 {됐네요}. 이제 자야겠어요.","已经十二点了啊，该睡了。"]],"x":"A-군요, V-는군요（恍然大悟的感叹）、-(으)ㄴ/는데요（委婉的感叹或说明）、-대요（转述听来的消息）。","n":"① 只能用于自己亲身发现的事；听别人转述的要用 -대요 / -다고 해요。\n② 说话人早就知道的事不能用 -네요，也不用来表达自己的意志或打算。\n③ 和 -군요 的区别：-네요 更口语、更亲切；-군요 的“恍然大悟”感更强，听起来稍微庄重。\n④ 常用来礼貌地回应对方的话：아, 그렇네요.（啊，原来是这样呢。）\n⑤ 过去时的 -았/었네요 说的是“发现事情已经发生”，不是单纯讲过去：눈이 왔네요（发现下过雪了）。"},"A-(으)ㄴ가요?,V-나요?":{"m":"比 -아/어요? 更柔和、更有礼貌的疑问句尾，相当于“请问…吗？”。","c":"语气委婉，不显得唐突，常用于对不太熟的人、顾客、病人或需要客气提问的场合。形容词和名词用 -(으)ㄴ가요?，动词用 -나요?。过去时不分形容词和动词，统一用 -았/었나요?。","r":"形容词：无收音 ㄴ가요　크다 → 큰가요　有收音 은가요　좋다 → 좋은가요\nㄹ 收音形容词：ㄹ 脱落后加 ㄴ가요　멀다 → 먼가요　길다 → 긴가요\n不规则：춥다 → 추운가요　어렵다 → 어려운가요\n名词：N인가요　학생인가요\n动词：词干 + 나요　가다 → 가나요　먹다 → 먹나요　살다 → 사나요\n있다/없다（包括 맛있다、재미있다）：있나요　없나요　맛있나요\n过去（形容词和动词都一样）：-았/었나요　바빴나요　갔나요\n敬语：-(으)시나요　바쁘신가요","e":[["요즘 많이 {바쁜가요}?","最近很忙吗？"],["혹시 이 근처에 약국이 {있나요}?","请问这附近有药店吗？"],["한국어는 언제부터 {공부했나요}?","你是从什么时候开始学韩语的？"]],"x":"-아/어요?（一般疑问）、-지요?（确认）、-(으)ㄹ까요?（提议或推测）。","n":"① 形容词用 -(으)ㄴ가요?，动词用 -나요?，不要混用：不说 바쁘나요?、먹은가요?。\n② 있다/없다 类按动词处理：맛있나요?。\n③ 过去时形容词也用 -았/었나요?，不是 -았/었은가요。\n④ 和 -(으)ㄹ까요? 不同：-(으)ㄹ까요? 是提议或猜测，-나요? 是询问事实。\n⑤ 对长辈要加 -(으)시：선생님은 요즘 바쁘신가요?。"},"A/V-(으)ㄴ/는데요":{"m":"放在句尾，表示“我有一点情况想说明（所以…）”，可以用来委婉地表达看法、拒绝、不同意，或表示感叹和意外。","c":"-(으)ㄴ/는데 去掉后面的话，只留 요，变成一种留有余味的句尾。常见用法：① 委婉说明、暗示（不好直接拒绝时）；② 电话或窗口开口询问；③ 表示意外、感叹；④ 轻轻地提出不同意见：그건 아닌데요。","r":"动词现在：-는데요　먹다 → 먹는데요　가다 → 가는데요　살다 → 사는데요\n形容词现在：-(으)ㄴ데요　크다 → 큰데요　좋다 → 좋은데요　멀다 → 먼데요\n过去：-았/었는데요　봤는데요　맛있었는데요\n名词：N인데요　학생인데요\n있다/없다：있는데요　없는데요\n不规则：춥다 → 추운데요　그렇다 → 그런데요","e":[["저는 매운 음식을 잘 못 {먹는데요}.","我不太能吃辣的呢。（言下之意：恐怕不行）"],["지금 김 선생님 {계신데요}?","请问金老师现在在吗？"],["와, 키가 정말 {큰데요}!","哇，个子真高啊！"]],"x":"A/V-(으)ㄴ/는데（连接句子的背景或转折）、A/V-네요（单纯的发现感叹）、A-군요, V-는군요。","n":"① 和 -네요 的区别：-네요 是单纯的发现；-(으)ㄴ/는데요 常带“和预想不同”或“后面还有话没说”的余味。\n② 在不好直接说“不”的时候使用，听起来比 못 먹어요 柔和。\n③ 现在时动词用 -는데요，形容词用 -(으)ㄴ데요，不要弄混。\n④ 接电话、在柜台问话时常用：여보세요, 김 선생님 계신데요?。\n⑤ 有时用来轻轻反驳，语气比直说 아니에요 更温和：그건 아닌데요。"},"A/V-(으)ㄴ/는데?":{"m":"放在句尾、语调上扬，表示“我这边是这样的呀…？”，用来提醒对方、追问，或带着疑惑提出不同的看法。多用于关系亲近的半语。","c":"-(으)ㄴ/는데 本来是先铺垫背景再接后半句；这里把后半句省略，停在 -는데?，让对方来接话。常见三种：① 提醒：어제 분명히 말했는데?（我昨天明明说过呀？）② 表示不同意：나는 괜찮은데?（我觉得没问题呀？）③ 带疑问词追问：뭐 하는데?（你在做什么呢？）。对不太熟的人要加 요：-(으)ㄴ/는데요?。","r":"和 -(으)ㄴ/는데 的变化相同\n动词现在：-는데　가다 → 가는데?　먹다 → 먹는데?　살다 → 사는데?\n形容词：-(으)ㄴ데 / 은데　크다 → 큰데?　좋다 → 좋은데?　멀다 → 먼데?\n过去：-았/었는데?　말했는데?\n있다/없다：있는데?　재미없는데?\n名词：N인데?\n不规则：춥다 → 추운데?\n礼貌：-(으)ㄴ/는데요?","e":[["어제 분명히 {말했는데}? 기억 안 나?","我昨天明明说过的呀？你不记得吗？"],["나는 이 영화 별로 {재미없는데}? 너는 재미있었어?","我觉得这部电影不怎么有意思啊？你觉得好看吗？"],["지금 밖에 비가 {오는데}? 우산도 없이 나갈 거야?","外面正下着雨呢？你连伞都不带就出去吗？"]],"x":"A/V-(으)ㄴ/는데（背景铺垫）、A/V-(으)ㄴ/는데요（委婉说明）、-잖아（提醒对方本来知道的事）、V-(으)니까?。","n":"① 语调必须上扬，否则就变成普通陈述句。\n② 这是半语，对长辈或不熟的人要加 요，并注意语气，不然会显得没礼貌。\n③ 和 -(으)ㄴ/는데요 的区别：-는데요 是柔和地把话说到一半；-는데? 是带着疑问，把话抛给对方。\n④ 句子里有 뭐、어디、언제 等疑问词时，就是单纯的追问：어디 가는데?。\n⑤ 动词现在用 -는데，形容词用 -(으)ㄴ데，不要弄混。"},"V-(으)니까?":{"m":"放在句尾、语调上扬，表示“是因为…吗？”或“…之后（结果）怎么样？”，用来求证理由或追问对方做过之后的感受。","c":"-(으)니까 本来用来说明理由，或表示“做了才发现”。把后半句省略、语调上扬，就变成两种问法：① 猜测对方的理由并求证：비가 오니까?（是因为下雨吗？）② 追问结果和感受：가 보니까?（去了之后怎么样？）。这是口语半语，常常是接着对方的话说。","r":"和 -(으)니까 的变化相同\n无收音 + 니까：가다 → 가니까?　끝나다 → 끝나니까?\n有收音 + 으니까：먹다 → 먹으니까?　좋다 → 좋으니까?\nㄹ 收音脱落：살다 → 사니까?　만들다 → 만드니까?\n过去：-았/었으니까?　끝났으니까?\n名词：N(이)니까?\n不规则：춥다 → 추우니까?　듣다 → 들으니까?\n对不太熟的人：加 요","e":[["오늘 약속 취소하자고? {비가 오니까}?","你说今天的约会取消吧？是因为下雨吗？"],["그 식당에 직접 {가 보니까}? 맛은 어땠어?","亲自去了那家餐厅之后呢？味道怎么样？"],["오늘 왜 이렇게 일찍 왔어? 일이 빨리 {끝났으니까}?","你今天怎么这么早来？是因为活儿提前做完了吗？"]],"x":"A/V-(으)니까（理由、发现）、-아/어서（因为）、A/V-(으)ㄴ/는데?（追问）、-아/어 보니까（做了之后发现）。","n":"① 只是猜测理由，说话人并不确定；确定的理由用 -(으)니까 加上后半句来说。\n② -아/어서 不能这样放在句尾提问，只有 -(으)니까 可以。\n③ 语调上扬、而且是半语；对不太熟的人要加 요。\n④ 常常是接着对方的话说，不适合凭空开口。\n⑤ 追问结果时常用 -아/어 보니까?，意思是“试了或去了之后，发现怎么样”。"},"冠词形-(으)ㄴ/는/(으)ㄹ N":{"m":"把动词或形容词变成修饰名词的形式，意思是“…的 N”。","c":"根据时间选形式：动词过去用 -(으)ㄴ（먹은 음식=吃过的食物）；动词现在用 -는（먹는 음식=在吃的食物）；动词将来或推测用 -(으)ㄹ（먹을 음식=要吃的食物）；形容词现在用 -(으)ㄴ（예쁜 꽃=漂亮的花）。있다/없다 类词（맛있다、재미없다）用 -는。过去的回想用 -던 / -았/었던。","r":"动词过去 -(으)ㄴ：가다 → 간　먹다 → 먹은　살다 → 산　만들다 → 만든\n动词现在 -는：가는　먹는　사는　만드는\n动词将来 -(으)ㄹ：갈　먹을　살　만들\n形容词 -(으)ㄴ：예쁘다 → 예쁜　작다 → 작은　길다 → 긴　멀다 → 먼\n있다/없다：있는　없는　맛있는　재미없는\n名词：N인　학생인 친구\n不规则：춥다 → 추운　돕다 → 도운　그렇다 → 그런","e":[["어제 {먹은} 비빔밥이 정말 맛있었어요.","昨天吃的拌饭真好吃。"],["지금 {듣는} 노래 제목이 뭐예요?","现在听的这首歌叫什么名字？"],["내일 {입을} 옷을 미리 골라 놓았어요.","已经提前挑好了明天要穿的衣服。"]],"x":"-던（回想）、-았/었던（过去回想）、-(으)ㄴ 적이 있다、-(으)ㄹ 수 있다（同样的 -(으)ㄹ 形）。","n":"① 形容词现在只能用 -(으)ㄴ：예쁜 꽃，不说 예쁘는 꽃。\n② 있다/없다 结尾的词不管是动词还是形容词，都用 -는：맛있는 음식、재미없는 영화。\n③ ㄹ 收音词干要脱落：만드는、만든，但将来形 -(으)ㄹ 保留：만들 사람。\n④ 将来形后面常接 곳、것、사람、시간：갈 곳（要去的地方）、먹을 것（吃的东西）。\n⑤ 想回想以前的状态，用 -던：어릴 때 살던 집（小时候住过的家）。"},"A/V-기":{"m":"把动词或形容词变成名词，表示“做…这件事”，也用来构成许多固定搭配。","c":"主要有三类用法：① 直接当名词：제 취미는 사진 찍기예요（爱好是拍照）；② 接形容词，表示“做起来…”：읽기 쉽다、듣기 좋다、말하기 어렵다；③ 和别的语法组合：-기 전에、-기 때문에、-기로 하다、-기 시작하다、-기를 바라다。语言技能的名称也用它：듣기、말하기、읽기、쓰기。","r":"词干 + 기（不分收音，也不改变词干）\n찍다 → 찍기　읽다 → 읽기　가다 → 가기\nㄹ 收音不脱落：만들다 → 만들기　살다 → 살기\n不规则词干不变形：듣다 → 듣기　돕다 → 돕기　쓰다 → 쓰기　춥다 → 춥기\n名词：N이기","e":[["제 취미는 사진 {찍기}예요.","我的爱好是拍照。"],["이 책은 글씨가 커서 {읽기} 쉬워요.","这本书字很大，读起来很容易。"],["한국어 {말하기} 시험이 다음 주에 있어요.","韩语口语考试在下周。"]],"x":"-는 것（也是名词化，更口语）、-(으)ㅁ（书面的名词化）、-기 전에、-기 때문에、-기로 하다。","n":"① 接形容词表示“做起来…”：读起来容易 → 읽기 쉽다，不是 읽는 것이 쉽다（后者也可以，但前者更自然）。\n② 和 -기 전에 不要混：-기 전에 是“…之前”，这里讲的是名词化本身。\n③ ㄹ 收音词干保持原样：만들기（不是 만드기）。\n④ 爱好、考试科目、固定搭配多用 -기；说具体的一件事，口语里常用 -는 것。\n⑤ 与 -(으)ㅁ 的区别：-(으)ㅁ 偏书面，如 기쁨、슬픔、웃음。"},"A-게":{"m":"把形容词变成副词，意思是“…地”，用来修饰后面的动词或形容词。","c":"-게 加在形容词词干后，说明后面的动作是“怎样”做的。也是几个重要句型的组成部分：-게 하다/만들다（使…）、-게 되다（变得…）、-지 않게（不要…地）。注意有些形容词的副词形不用 -게，而是 -이、-히（많이、깨끗이、조용히）。","r":"形容词词干 + 게（不分收音）\n예쁘다 → 예쁘게　크다 → 크게　좋다 → 좋게　짧다 → 짧게\n不规则词干在 -게 前不变形（因为 게 以辅音开头）：춥다 → 춥게　맵다 → 맵게　빠르다 → 빠르게　빨갛다 → 빨갛게\n하다 → 하게：깨끗하다 → 깨끗하게　즐겁다 → 즐겁게\n否定：-지 않게　맵지 않게\n发音：맵게[맵께]　짧게[짤께]","e":[["머리를 {짧게} 잘랐어요.","我把头发剪短了。"],["아이들이 마당에서 {즐겁게} 놀고 있어요.","孩子们在院子里玩得很开心。"],["너무 맵지 {않게} 해 주세요.","请不要做得太辣。"]],"x":"-게 되다（变得…）、-게 하다/만들다（使…）、A-아/어지다、-이/-히（另一类副词）。","n":"① 区别冠词形和副词形：예쁜 옷（形容 N）/ 예쁘게 입었어요（修饰动词）。\n② 有些词的副词形固定用 -이/-히：많이、깨끗이、조용히，不说 많게。\n③ -게 前面不用变形，所以 ㅂ 不规则词不会变成 우：춥게、덥게、맵게。\n④ 拜托别人“不要太…”时常用 -지 않게 해 주세요。\n⑤ 只接形容词，动词变化要用 -게 되다。"},"形容词 A-아/어하다":{"m":"把表示感觉、感情的形容词变成动词，用来描述第三人称的感受，意思是“觉得…、表现出…”。","c":"形容词本身只能说“我自己的感受”，描述别人的感受要变成动词：저는 강아지가 좋아요（我喜欢小狗）→ 동생은 강아지를 좋아해요（弟弟喜欢小狗）。常见的有：좋아하다、싫어하다、무서워하다、부러워하다、기뻐하다、슬퍼하다、힘들어하다、귀여워하다。-고 싶다 的第三人称是 -고 싶어 하다。","r":"最后元音是 ㅏ/ㅗ → -아하다：좋다 → 좋아하다　아프다 → 아파하다（ㅡ 脱落）\n其他元音 → -어하다：싫다 → 싫어하다　힘들다 → 힘들어하다\nㅂ 不规则：무섭다 → 무서워하다　부럽다 → 부러워하다　귀엽다 → 귀여워하다\nㅡ 脱落：기쁘다 → 기뻐하다　슬프다 → 슬퍼하다\n하다 结尾 → 해하다：행복하다 → 행복해하다","e":[["제 동생은 매운 음식을 아주 {좋아해요}.","我弟弟特别喜欢吃辣的。"],["아이가 주사를 {무서워해서} 병원에 가기 싫어해요.","孩子害怕打针，不想去医院。"],["친구는 시험에 합격해서 아주 {기뻐했어요}.","朋友考上了，非常高兴。"]],"x":"A-고 싶다 / V-고 싶어 하다、A-아/어요（直接说自己的感受）、N이/가 좋다 vs N을/를 좋아하다。","n":"① 助词会变：形容词用 N이/가（강아지가 좋아요），变成动词后用 N을/를（강아지를 좋아해요）。\n② 说自己当下的感受用形容词（무서워요），描述别人的感受用 -아/어하다（무서워해요）。\n③ 只用于表示感情、感觉、好恶的形容词，不是所有形容词都能这样变。\n④ 想说第三人称“想要…”，要用 -고 싶어 하다，不能说 -고 싶다。\n⑤ ㅂ 不规则和 ㅡ 脱落要先变形再接 하다：부러워하다、기뻐하다。"},"直接引用“라고/하고+动词”":{"m":"把别人说过的话、写下的字原封不动地引用出来：“某人说：‘……’”。","c":"引用的内容放在引号里，保持原话的语气和句尾不变，后面接“라고/하고 + 말하다、묻다、대답하다、쓰다、소리치다”等动词。书面上 라고 更常用，口语里 하고 更自然。","r":"“原话”라고 + 动词：민수 씨가 “내일 만나요”라고 말했어요\n“原话”하고 + 动词：엄마가 “빨리 와” 하고 소리쳤어요\n原话本身是什么句尾就保留什么：陈述、疑问、命令、邀请都可以直接放进引号\n后面的动词常见：말하다、묻다、대답하다、쓰다、생각하다、외치다、소리치다","e":[["민수 씨가 “내일 같이 만나요”{라고} 말했어요.","敏秀说：“明天一起见面吧。”"],["선생님께서 “숙제를 꼭 내세요”{라고} 하셨어요.","老师说：“作业一定要交。”"],["엄마가 “빨리 일어나” {하고} 소리쳤어요.","妈妈大喊：“快起床！”"]],"x":"间接引用 -다고/냐고/자고/(으)라고 하다（转述内容，人称、语气随之变化）、间接引用缩略词 -대요/-냬요/-재요/-래요（口语里常用的缩写）。","n":"① 原话要原样保留，人称、敬语、句尾都不改：他说 “저는 학생이에요” 라고 했어요。\n② 라고 和 하고 的区别：라고 适用于书面和口语，하고 偏口语、带有拟声或感叹的色彩，后面经常紧接动作动词，如 소리치다、웃다。\n③ 如果不用引号，而是转述内容，就要改成间接引用，人称和句尾都要调整。\n④ 引号里是名词或单词时也可以：그 사람을 “천재”라고 불러요。"},"间接引用":{"m":"不照搬原话，而是用自己的话转述别人说的内容：“某人说……”“某人问……”“某人叫我……”。","c":"根据原话是陈述、疑问、邀请还是命令，使用不同的转述词尾：-다고、-냐고、-자고、-(으)라고，后面接 하다、말하다、묻다 等。人称、时态要按转述时的立场调整。","r":"陈述句：动词无收音 -ㄴ다고（간다고），有收音 -는다고（먹는다고）；形容词 -다고（바쁘다고、좋다고）；名词 (이)라고（학생이라고）；过去 -았/었다고；将来 -(으)ㄹ 거라고\nㄹ 收音动词：만들다 → 만든다고、살다 → 산다고\n疑问句：-냐고（가냐고、먹냐고；形容词 좋으냐고/좋냐고；名词 학생이냐고）；过去 -았/었냐고\n邀请句：-자고（가자고、먹자고）；否定 -지 말자고\n命令句：-(으)라고（가라고、먹으라고）；否定 -지 말라고\n引导动词：말하다、묻다、대답하다、하다","e":[["민수 씨는 요즘 많이 {바쁘다고} 했어요.","敏秀说他最近很忙。"],["선생님께서 내일까지 숙제를 {내라고} 하셨어요.","老师说让我们明天之前交作业。"],["친구가 주말에 같이 영화를 {보자고} 했어요.","朋友说周末一起看电影。"]],"x":"直接引用 “라고”（保留原话）、间接引用缩略词 -대요/-냬요/-재요/-래요、-(으)ㄴ/는지（不确定的转述）。","n":"① 转述时人称要改变：原话 “나는 학생이야” → 민수 씨는 자기가 학생이라고 했어요。\n② 动词现在时的陈述要加 -ㄴ/는-：가다 → 간다고（不是 가다고）。形容词和 있다/없다 则直接用 -다고。\n③ 命令和邀请只能接动词，形容词不能用。\n④ 否定的命令要用 -지 말라고，不是 안 -(으)라고。\n⑤ 问句的转述词尾是 -냐고，不是 -다고；要和 -(으)ㄴ/는지 모르다 之类的间接疑问区分开。"},"间接引用缩略词":{"m":"口语里把“间接引用 + 하다”缩短成一个词：-다고 해요 → -대요，-냐고 해요 → -냬요，-자고 해요 → -재요，-(으)라고 해요 → -(으)래요。","c":"转述别人刚说过的话，语气自然、随意，常见于朋友或家人之间的对话。表示“听说…”“他说…”。","r":"陈述：-ㄴ/는다고 해요 → -ㄴ/는대요（간대요、먹는대요）；形容词 -다고 해요 → -대요（바쁘대요、좋대요）\n名词：(이)라고 해요 → (이)래요（학생이래요、친구래요）\n疑问：-냐고 해요 → -냬요（가냬요、좋냬요）\n邀请：-자고 해요 → -재요（가재요、먹재요）\n命令：-(으)라고 해요 → -(으)래요（가래요、먹으래요）\n过去的说法：-았/었대요、将来：-(으)ㄹ 거래요\n过去时的转述：-다고 했어요 → -댔어요、-자고 했어요 → -쟀어요、-(으)라고 했어요 → -랬어요","e":[["민수 씨는 오늘 많이 {바쁘대요}.","听说敏秀今天很忙。"],["친구가 주말에 같이 {놀재요}.","朋友说周末一起玩。"],["선생님이 내일까지 숙제를 {내래요}.","老师说明天之前要交作业。"]],"x":"间接引用 -다고/냐고/자고/(으)라고 하다（完整形式）、-(으)ㄴ/는데요（带有背景的语气）、-더라고요（亲身经历后转述）。","n":"① 缩略词只用于口语，写作文或正式场合用完整形式。\n② 名词后的 (이)래요 容易和 -(이)에요 混淆：학생이래요（听说是学生）≠ 학생이에요（是学生）。\n③ 命令的 -(으)래요 和陈述的 -대요 只差一个字，要靠上下文分清：가래요（让我去）、간대요（听说去）。\n④ 要表达“听说”的事实，也可以说 -다고 해요；用缩略词意思相同，更口语。\n⑤ 对长辈转述别人的话时，句尾要加 -(으)셨- 或换成 -다고 하십니다。"}};
